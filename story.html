<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即墨 - 故事创作</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 宣纸底色系 */
            --paper-new: oklch(98% 0.006 95);
            --paper-aged: oklch(96% 0.010 92);
            --paper-dark: oklch(92% 0.014 88);
            /* 墨分五色 */
            --ink-light: oklch(65% 0.018 85);
            --ink-mid: oklch(40% 0.024 80);
            --ink-heavy: oklch(20% 0.030 70);
            --ink-black: oklch(15% 0.032 60);
            /* 朱砂唯一点缀 */
            --seal: oklch(48% 0.16 28);
            --seal-dark: oklch(38% 0.18 22);
            /* 边框 */
            --border: oklch(82% 0.008 90);
            --border-dark: oklch(60% 0.012 82);
            /* 语义别名 — 指向宣纸/墨色体系 */
            --bg-primary: var(--paper-new);
            --bg-secondary: var(--paper-aged);
            --bg-tertiary: var(--paper-dark);
            --surface-card: rgba(255, 255, 255, 0.92);
            --surface-card-soft: rgba(255, 255, 255, 0.78);
            --surface-overlay: rgba(45, 42, 38, 0.6);
            --text-primary: var(--ink-black);
            --text-secondary: var(--ink-mid);
            --text-muted: var(--ink-light);
            --text-inverse: #ffffff;
            --accent-primary: var(--seal);
            --accent-secondary: var(--seal-dark);
            --accent-tertiary: oklch(55% 0.12 25);
            --accent-world: oklch(50% 0.10 230);
            --accent-protagonist: oklch(50% 0.10 40);
            --accent-narrative: oklch(50% 0.10 140);
            --success: #5a8a50;
            --warning: #c88a3a;
            --error: #b85555;
            --info: #5b7aaa;
            --border-light: var(--border);
            --border-medium: var(--border-dark);
            --topbar-bg: #2c2825;
            --topbar-text: #e8e2d8;
            --shadow-soft: 0 2px 12px rgba(100, 80, 50, 0.07), 0 4px 20px rgba(100, 80, 50, 0.05);
            --shadow-medium: 0 4px 16px rgba(100, 80, 50, 0.10), 0 8px 30px rgba(100, 80, 50, 0.08);
            --shadow-strong: 0 8px 24px rgba(100, 80, 50, 0.14), 0 14px 40px rgba(100, 80, 50, 0.10);
            --shadow-glow: 0 4px 18px rgba(196, 151, 30, 0.35);
            /* 字体 */
            --font-display: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
            /* 间距 */
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 48px;
            --space-xl: 80px;
            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            /* 过渡 */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--paper-new);
            color: var(--ink-light);
            line-height: 1.8;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--topbar-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            color: var(--topbar-text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.22);
            color: #fff;
            border-color: rgba(255,255,255,0.35);
        }
        .story-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--topbar-text);
        }
        .top-right {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }
        .top-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all var(--transition-normal);
            background: rgba(255,255,255,0.1);
            color: var(--topbar-text);
            white-space: nowrap;
        }
        .top-btn:hover {
            background: rgba(255,255,255,0.22);
            color: #fff;
            border-color: rgba(255,255,255,0.35);
        }
        .top-btn:active {
            transform: scale(0.95);
        }
        .top-btn:disabled,
        .btn:disabled {
            opacity: 0.58;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-save { background: rgba(90,138,80,0.95); border-color: rgba(90,138,80,0.6); }
        .btn-export { background: rgba(196,151,30,0.85); border-color: rgba(196,151,30,0.5); }

        /* World Banner — collapsible */
        .world-banner {
            padding: 6px var(--space-md);
            margin-bottom: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .banner-details { }
        .banner-summary {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-primary);
            padding: 3px 0;
            list-style: none;
            user-select: none;
        }
        .banner-summary::-webkit-details-marker { display: none; }
        .banner-summary::marker { display: none; }
        .summary-arrow {
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        details[open] .summary-arrow { transform: rotate(90deg); }
        .banner-body {
            padding: 6px 0 6px 18px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .world-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .tag {
            display: inline-block;
            padding: 1px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .world-desc-detail {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .character-info {
            display: flex;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 2px 0;
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }
        /* Container — story panel, always centered, max-width 560px */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 560px;
            padding: 16px 0 0;
            min-height: 0;
            overflow: hidden;
            transition: max-width 0.3s ease, padding 0.3s ease;
        }

        /* ===== Timeline（垂直线+节点）===== */
        .story-timeline {
            width: 48px;
            flex-shrink: 0;
            position: relative;
            background: transparent;
        }
        .timeline-track {
            position: absolute;
            left: 50%;
            top: 12px;
            bottom: 12px;
            width: 1px;
            background: #e5e0d8;
            transform: translateX(-50%);
        }
        .timeline-nodes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .timeline-node {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid #fff;
            z-index: 2;
        }
        .timeline-node:hover {
            width: 16px;
            height: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .node-critical { background: var(--seal); }
        .node-major { background: var(--ink-mid); }
        .node-normal { background: var(--ink-light); }

        /* ===== Sidebar（右侧面板）===== */
        .story-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--paper-aged);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-tabs {
            display: flex;
            gap: 2px;
            padding: 12px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .s-tab {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .s-tab:hover { background: var(--bg-secondary); color: var(--text-secondary); }
        .s-tab.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 600; }

        .sidebar-body { flex: 1; overflow-y: auto; min-height: 0; }
        .sb-pane { display: none; padding: 12px; }
        .sb-pane.active { display: block; }
        .sb-list { display: flex; flex-direction: column; gap: 8px; }

        /* Sidebar list items */
        .ol-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            cursor: pointer;
        }
        .ol-item:hover { color: var(--text-primary); }
        .ol-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .ol-dot.critical { background: #c97a7a; }
        .ol-dot.major { background: #c9a060; }
        .ol-dot.normal { background: #b0a99e; }

        .cl-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .cl-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-world);
            flex-shrink: 0;
            margin-top: 6px;
        }
        .cl-state {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-muted);
            margin-top: 2px;
        }
        .cl-name { font-weight: 600; color: var(--text-primary); margin-right: 6px; }

        .ch-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .ch-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }
        .ch-name { font-weight: 600; color: var(--text-primary); }
        .ch-rel { font-size: 0.7rem; color: var(--text-muted); }

        .ch-graph {
            margin-top: 12px;
            padding: 12px;
            background: #fcfbf9;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .ch-graph svg { overflow: visible; }

        /* Story Content */
        .story-content {
            flex: 1;
            background: var(--paper-new);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 12px;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .story-text {
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--text-primary);
        }
        .story-text p {
            margin-bottom: 1.1em;
            text-indent: 2em;
        }
        .story-text p:first-child {
            margin-top: 0;
        }
        .story-text p:last-child {
            margin-bottom: 0;
        }
        .story-text .choice-line {
            text-indent: 0;
            color: var(--accent-tertiary);
            font-weight: 600;
            margin: 1.2em 0 0.6em;
            padding-left: 1em;
            border-left: 3px solid var(--accent-primary);
        }
        .story-divider {
            border: none;
            margin: 36px 0;
            text-align: center;
            height: auto;
            overflow: visible;
            position: relative;
        }
        .story-divider::before {
            content: '';
            position: absolute;
            left: 20%;
            right: 20%;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-medium), transparent);
        }
        .story-divider::after {
            content: '◆';
            display: block;
            position: relative;
            color: var(--border-dark);
            font-size: 0.7rem;
            background: var(--surface-card);
            width: 32px;
            margin: 0 auto;
            letter-spacing: 0;
        }
        .story-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px;
            color: var(--text-muted);
        }
        .loading-dots {
            display: flex;
            gap: 4px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 固定底栏 */
        .bottom-action-bar {
            flex-shrink: 0;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 14px 20px;
            box-shadow: 0 -2px 12px rgba(100, 80, 50, 0.07);
            z-index: 90;
        }
        .bottom-action-inner {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .bottom-action-inner .custom-input {
            flex: 1;
            min-height: 42px;
            max-height: 100px;
            padding: 10px 14px;
            font-size: 0.9rem;
            resize: none;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-family: inherit;
            background: var(--bg-primary);
            transition: all var(--transition-fast);
        }
        .bottom-action-inner .custom-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(201, 168, 108, 0.15);
        }
        .bottom-action-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .bottom-action-btns .btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .bottom-continue-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 6px;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all var(--transition-normal);
        }
        .btn-primary {
            background: var(--ink-heavy);
            color: var(--paper-new);
            border: none;
            border-radius: 4px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-primary:hover { background: var(--ink-black); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled {
            background: var(--border-dark);
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-medium);
        }
        .btn-secondary:hover {
            background: var(--accent-tertiary);
            color: var(--text-inverse);
            border-color: var(--accent-tertiary);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }

        /* Continue indicator */
        .continue-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .story-status {
            flex-shrink: 0;
            min-height: 1.2em;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 4px;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 16px);
            padding: 10px 16px;
            max-width: min(520px, calc(100vw - 32px));
            background: rgba(45, 42, 38, 0.92);
            color: #fff;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-strong);
            font-size: 0.88rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal), transform var(--transition-normal);
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-tertiary); }

        /* API Modal */
        .api-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .api-modal.show {
            display: flex;
        }
        .api-modal-content {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .api-modal-content h3 {
            margin: 0 0 16px;
            font-family: var(--font-display);
            color: var(--text-primary);
        }
        .api-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .api-input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .api-modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.82rem;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
        }
        .btn-sm:hover { background: var(--bg-tertiary); }

        .story-segment { position: relative; }
        .seg-toolbar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
        .seg-edit-btn {
            padding: 2px 10px;
            font-size: 0.72rem;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-fast);
        }
        .seg-edit-btn:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .seg-edit-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .seg-original-panel, .seg-edited-panel {
            background: var(--paper-aged);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 16px;
        }
        .seg-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }
        .seg-original-text {
            font-size: 0.88rem;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }
        .seg-edit-textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            padding: 10px 12px;
            font-size: 0.9rem;
            line-height: 1.8;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-primary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
        }
        .seg-edit-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(201, 168, 108, 0.15);
        }
        .seg-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }
        .seg-edit-actions .btn-sm {

        let personalityFramework = {}; // chineseCategories or westernCategories

        // System prompts — read from localStorage (synced with admin.html)
        const DEFAULT_STORY_PROMPT = `你是专业网文作家。核心理念：用户是灵魂，AI是笔。用户不需要会写，只需要会选。AI负责把用户的选择，用专业的方式落到纸上。

【AI核心能力】
1. 考据隐身：虚构设定锚定真实知识体系，只驱动底层逻辑
2. 结构守护：伏笔不漏，人设不塌，时间线不出bug
3. 多领域即时调度：需要什么知识调什么知识，不中断写作流
4. 多维并行推演：同时推演主角、对手、旁观者、环境、伏笔五条线
5. 文风瞬时适配：根据设定自动匹配叙事温度和留白比例
6. 持续输出零衰减：保持一致性，保持产出节奏

【故事机制】
第一步：世界观已生成
第二步：以第三人称开篇，直接进入冲突。用户在阅读中进入世界
第三步：每个关键节点，在主角面临抉择、危机或转折时停笔，由用户在底部输入框自行决定剧情走向
第四步：用户输入选择后，沿选定方向推进叙事
第五步：新的节点，再次停笔，形成持续的分支叙事

【写作铁律 — 源自八大准则，每次写作自动执行】

第一条·钩子：首句必须包含异常（不该发生的事发生了）、不安（让人心里发毛）、或未解（必须知道答案的问题）。
 示范："皇帝收到一封从未来寄来的信"（异常）、"孟惊蝉发现铜镜里自己的倒影慢了半拍才转头"（不安）

第二条·感受优先：先写身体反应、情绪涌动、直观感受。解释能不给就不给。让读者从动作和对话里读到情绪。
 错误：她很难过。 正确：她把那张纸折了又折，折到再也折不动。

第三条·节奏控制：每千字必须有情绪转折或情节推高。平静段落底下埋暗流——对话有潜台词，环境有暗示，角色心里有没说出口的东西。

第四条·规则要演出来：每引入设定，必须紧接着有角色因这条规则而改变命运。不说"这个世界强者为尊"，直接写强者如何踩人、弱者如何被踩。空讲设定等于没写。

第五条·行动即人设：不给角色贴性格标签（隐忍、善良、腹黑）。只写他在关键时刻做了什么选择、怎么做、做完什么反应。选择比描写多十倍说服力。

第六条·爽点兑现：每章至少兑现一种底层爽感——翻身（被打压者扬眉吐气）、解密（隐藏的真相揭开）、占有（获得力量/财富/尊重）、自由（打破束缚按自己意志行事）、活下来（不可能中杀出生路）、守护（为某人或某物扛住压力）。写完自查：这章读者哪一刻会拍大腿？

第七条·语言透明：删除优先级——删掉所有可删的形容词 > 把所有心理描写试改成动作或对话 > 删掉炫技句子。最终标准：读者记住了场景和情绪，忘记语言本身的存在。

第八条·考据隐身：任何虚构设定锚定真实世界对象。专业信息全部隐入角色动作、对话、环境描写。正文绝不出现在何解释性注释或术语罗列。最终标准：读者说不出哪里好，但觉得这个世界的质感比别的世界更沉。

执行顺序：开篇先用第一条（钩子）→ 每段叙事按第二条（感受优先）展开 → 整体节奏按第三条（节奏控制）把控 → 引入设定按第四条（规则演出来）→ 塑造角色按第五条（行动即人设）→ 每章结尾回看第六条（爽点兑现）→ 修改阶段执行第七条（语言透明）→ 后台始终运行第八条（考据隐身）。全部过完，就是你想要的文字。

【读者心理钩子 — 压抑→释放机制】
每段剧情必须至少触发一种读者心理需求。先制造压抑端，再兑现释放端。压抑越深，释放越爽。

1. 正义需求：被冤枉/功劳被窃取 → 真相大白/恶人打脸 → 越是不公越想看"还我公道"
2. 安全需求：面临危险/倒计时压力 → 化险为夷/绝处逢生 → 害怕失去→紧张→得救→爽
3. 求知需求：谜题未解/伏笔未收 → 真相揭晓/伏笔回收 → 未知→好奇→满足
4. 归属需求：被孤立/被背叛/被误解 → 被接纳/被信任/和解 → 孤独→心疼→暖心
5. 道德需求：两难选择/被迫做坏事 → 找到第三条路/自我救赎 → 纠结→代入→释然
6. 掌控需求：失控/被玩弄/命运被安排 → 反杀/掌控局面/逆天改命 → 无力→焦虑→解气
7. 优越需求：恶人嚣张/好人吃亏 → 恶人遭报/好人逆袭 → 愤怒→爽快
8. 共情需求：痛苦/失去至亲/希望破灭 → 获得慰藉/希望重燃 → 难过→心疼→温暖

【情绪维度 - 让读者"抓心"】
- 压抑端先于释放端：让读者在"难受"里多待一会儿（被冤枉→等两章才洗清）
- 希望假动作：给读者希望，然后立刻拿走（以为找到证人了，结果证人是假的）
- 情绪反差：上一秒笑，下一秒哭（刚告白成功，下一秒收到噩耗）
- 延迟满足：读者想要的爽点延后给（恶人被打脸不是现在，是三十章后）
- 情感对照：用一件事反衬另一件事（女主被怀疑，男二无条件相信）
- 无声的疼：不写哭喊，写细节（把手机扣在桌上、把面碗留在水池里）
- 迟来的好：已经不需要了，对方才给（"对不起"——"没关系，我不需要了"）

【情节维度 - 让读者停不下来】
- 核心冲突：角色想要A，但现实给B（想留在家乡照顾母亲，但offer在外地）
- 层层加码：问题不是一次解决，而是一个接一个（被冤枉→证据被毁→证人失踪）
- 倒计时/时间压力：必须在X时间内完成某事（三天后婚礼、七天后还债）
- 两难选择：选A伤B，选B伤A（救母亲还是救恋人）
- 代价明确：做出选择要付出什么（说出真相会失去爱人、保持沉默会失去自我）
- 意外援军：最没想到的人出手相助（宿敌递来关键证据）
- 功亏一篑：差一点就成功了，然后功亏一篑（找到证据了，但被抢走了）
- 反转：读者以为的"真相"是错的（以为的好人其实是幕后黑手）

【细节维度 - 让世界真实可感】
- 感官细节：看/听/闻/触/尝（消毒水的味道、旧书的霉味）
- 习惯动作：角色紧张/开心时的小动作（紧张时转笔、开心时哼歌）
- 道具象征：某个物品承载情感（一只旧手表、一条围巾、一盆快死的绿萝）
- 环境投射：天气/光线反映角色情绪（下雨天分手、晴空万里时被骗）
- 对话潜台词：嘴上说A，实际意思是B（"你来干什么"——"我想你了"）
- 留白：不写出来的，比写出来的更重（对方正在输入……最后什么都没发）

【角色核心创伤 - 10种类型】
赋予每个角色1-2种核心创伤，决定行为模式和情感按钮：
1. 被抛弃型：不相信自己值得被留下 → 要么过度黏人要么不敢靠近，总在对方离开前先分手
2. 被忽视型：觉得自己的存在不重要 → 习惯性讨好他人，不知道怎么表达需求
3. 被背叛型：认为信任是危险的 → 很难信任任何人，反复测试忠诚
4. 被控制型：觉得自己没有权利做自己 → 要么极度顺从要么极度反叛
5. 被虐待型：深层认为自己"是坏的，活该" → 自我价值感极低，对伤害忍耐度异常高
6. 被孤立型：觉得自己不属于任何地方 → 对社交场合极度焦虑
7. 目睹暴力型：认为世界是危险的，爱与伤害总同时出现 → 不知道健康关系什么样
8. 过早承担型：没有童年，永远在照顾别人 → 不会示弱，不会求助，容易burnout
9. 失去安全型：随时可能出事，不能放松 → 过度警觉，无法放松
10. 身份否定型：真正的自己不配被爱，必须伪装 → 习惯性伪装成别人喜欢的样子

【结构维度 - 让读者一直追】
- 钩子开头：第一句话就让读者想知道"然后呢"
- 章节断点：每段结束在"最想知道下文"的地方
- 节奏变化：紧张的段落和舒缓的段落交替
- 伏笔与回收：前面埋的，后面一定要挖
- 情感节拍：压抑-释放-再压抑-更大释放
- 爽点分布：小爽点每1-2段一次，大爽点每5-10段一次

【输出要求】
第三人称开场，直接进入冲突。文字直白有张力，画面感强。结尾停在主角的剧情转折点——面临抉择、危机或关键发现时停笔。不提供选项，让用户在底部输入框自行决定。

【字数要求】
- 每次输出约半章篇幅（1000字左右），在主角面临抉择、危机或转折点时自然停笔
- 剧情打点不计入正文，放在正文之后

【剧情打点 - 智能标记】
在生成剧情的同时，请根据剧情内容智能判断并标记关键节点。

1. 【提纲节点】识别剧情中的关键转折点、高潮、悬念设置点：
   - 类型：转折 / 高潮 / 悬念 / 铺垫 / 揭示
   - 重要性：critical(重点剧情，红色) / major(较重要，橙色) / normal(普通，灰色)
   - 一句话总结（15字以内）

2. 【线索节点】识别线索的状态变化点，每条线索是一条独立时间线：
   - 线索名
   - 状态变化：伏笔→展开 / 展开→揭示 / 揭示→闭合 等
   - 一句话描述
   - 重要性

3. 【人物节点】识别新人物出场。每个新角色必须按主角生成规则立体塑造：
   - 人物ID（唯一标识，如 char_001）
   - 人物名
   - 核心创伤类型（从10种中选1种，决定行为模式）
   - 表层欲望 vs 深层需求（表面想要什么 / 真正缺什么）
   - 人物标签：主角 / 配角 / 反派 / 中立
   - 一句话简述（含身份、处境、性格底色）

4. 【关系边】识别已有节点之间的关系变化：
   - 源人物ID
   - 目标人物ID
   - 关系类型：敌对 / 盟友 / 主仆 / 血缘 / 师徒 / 爱慕 / 竞争 等
   - 关系强度（1-5分，随剧情变化可更新）
   - 首次建立关系的场景描述

输出格式（在正文结束后另起一行）：
【剧情打点】
[提纲节点]
转折 | critical | 主角发现密室暗门
悬念 | major | 神秘人留下警告信

[线索节点]
古宅秘宝 | 伏笔→展开 | 地图碎片出现 | major

[人物节点]
char_001 | 李管家 | 1 | 配角 | 古宅管家，知道秘密

[关系边]
char_001 | protagonist | 主仆 | 3 | 主角初入古宅，李管家前来迎接`;

        function getStoryPrompt() {
            try {
                const saved = localStorage.getItem('prompt_config');
                if (saved) {
                    const cfg = JSON.parse(saved);
                    if (cfg.storySystemPrompt) return cfg.storySystemPrompt;
                }
            } catch (e) {}
            return DEFAULT_STORY_PROMPT;
        }

        // Render prompt variables
        function renderPrompt(template, vars) {
            let result = template;
            for (const [key, value] of Object.entries(vars)) {
                result = result.replace(new RegExp(`\\{\\{${key}\\}\\}`, 'g'), value);
            }
            return result;
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        let abortController = null;

        function setLoadingState(loading, message = '') {
            isLoading = loading;
            const btn = document.getElementById('btnContinue');
            btn.disabled = false;
            btn.textContent = loading ? '停止创作' : '继续创作';
            document.getElementById('storyStatus').textContent = message;
        }

        let partialResult = '';

        function stopGeneration() {
            if (abortController) { abortController.abort();
                abortController = null; }
            typewriterReset();
            // Save whatever was generated so far
            if (partialResult.trim()) {
                const displayText = ensureCompleteSentence(stripStructuredMeta(partialResult));
                if (displayText.trim()) {
                    currentStory.history.push({ content: displayText, timestamp: Date.now() });
                    displayFullStory();
                    appendNewMeta(partialResult);
                    saveStoryData();
                    autoSave();
                }
            }
            partialResult = '';
            setLoadingState(false);
            showToast('已停止，内容已保留');
        }

        // Load from localStorage
        function loadStoryData() {
            const saved = localStorage.getItem('current_story_session');
            if (saved) {
                try {
                    currentStory = JSON.parse(saved);
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }

        // Save to localStorage
        function saveStoryData() {
            currentStory.storyOutline = storyOutline;
            currentStory.storyClues = storyClues;
            currentStory.characterCards = characterCards;
            currentStory.characterRelations = characterRelations;
            localStorage.setItem('current_story_session', JSON.stringify(currentStory));
        }

        // Migration: ensure history entries have `original` field
        function migrateHistory() {
            if (!Array.isArray(currentStory.history)) return;
            for (const seg of currentStory.history) {
                if (seg && typeof seg.original === 'undefined') {
                    seg.original = seg.content;
                }
            }
        }

        // Initialize page
        function init() {
            if (!loadStoryData()) {
                alert('没有找到故事数据，请先在首页开始创作');
                window.location.href = 'index.html';
                return;
            }

            migrateHistory();

            if (!currentStory.styleProfile) {
                currentStory.styleProfile = { voice: {}, language: {}, character: {}, taboos: [], examples: [] };
            }

            document.getElementById('worldTitle').textContent = currentStory.worldTitle || '未知世界';
            document.getElementById('characterInfo').textContent = '主角：' + (currentStory.protagonist || '未知');
            document.getElementById('narrativeInfo').textContent = '叙事：' + (currentStory.narrative || '默认');

            // World tags + description (inside collapsible)
            const tagsHtml = currentStory.worldTags.map(tag =>
                `<span class="tag">${escapeHTML(tag)}</span>`
            ).join('');
            document.getElementById('worldTags').innerHTML = tagsHtml;
            if (currentStory.worldDesc && currentStory.worldDesc !== currentStory.worldTags.join(' / ')) {
                document.getElementById('worldDescDetail').textContent = currentStory.worldDesc;
            }

            // Character detail (inside collapsible)
            if (currentStory.protagonistDesc) {
                document.getElementById('characterDetail').innerHTML =
                    '<span style="font-size:0.82rem;color:var(--text-primary);">' + escapeHTML(currentStory.protagonistDesc) + '</span>';
                if (currentStory.protagonistTags && currentStory.protagonistTags.length) {
                    document.getElementById('characterDetail').innerHTML +=
                        '<div style="margin-top:4px;">' + currentStory.protagonistTags.map(t =>
                        '<span class="tag">' + escapeHTML(t) + '</span>').join('') + '</div>';
                }
            } else {
                document.getElementById('characterDetail').textContent = '暂无角色详情';
            }

            // Restore sidebar data from previous session
            if (currentStory.storyOutline) storyOutline = currentStory.storyOutline;
            if (currentStory.storyClues) storyClues = currentStory.storyClues;
            if (currentStory.characterCards) characterCards = currentStory.characterCards;
            if (currentStory.characterRelations) characterRelations = currentStory.characterRelations;

            // Render sidebar
            renderOutline();
            renderClues();
            renderChars();
            renderRelationGraph();
            renderTimeline();

            // Display all history if exists
            if (currentStory.history.length > 0) {
                displayFullStory();
            } else {
                generateOpening();
            }

            renderStyleProfile();
            saveStoryData();
        }

        // Generate opening
        async function generateOpening() {
            setLoadingState(true, '正在生成开篇...');
            showLoading();

            const config = getApiConfig();
            if (!config.apiKey) {
                showToast('请先在首页设置 API Key');
                window.location.href = 'index.html';
                return;
            }

            const styleBlock = formatStylePrompt(currentStory.styleProfile);
            const prompt = `${getPrefPrompt()}${styleBlock}
世界：${currentStory.worldTitle}
世界逻辑：${currentStory.worldDesc || ''}
世界标签：${currentStory.worldTags.join('、')}
主角：${currentStory.protagonist}${currentStory.protagonistDesc ? ' — ' + currentStory.protagonistDesc : ''}
主角标签：${(currentStory.protagonistTags || []).join('、')}
叙事：${currentStory.narrative}

请根据以上设定，创作故事开篇。要求：
1. 第三人称开场，直接进入冲突
2. 首句必须有异常、不安或未解问题
3. 文字直白有张力，画面感强
4. 在主角面临抉择、危机或关键发现时停笔，不提供选项`;

            const systemPrompt = renderPrompt(getStoryPrompt(), {
                worldTitle: currentStory.worldTitle,
                worldDesc: currentStory.worldDesc || '',
                protagonist: currentStory.protagonist,
                goldenFinger: currentStory.goldenFinger || '无'
            });

            try {
                const result = await callDeepSeek(prompt, systemPrompt, (text) => {
                    partialResult = text;
                    displayStoryContent(text);
                });

                if (result) {
                    partialResult = '';
                    typewriterReset();
                    const displayText = ensureCompleteSentence(stripStructuredMeta(result));
                    const segment = {
                        content: displayText,
                        timestamp: Date.now()
                    };
                    currentStory.history.push(segment);
                    displayFullStory();
                    appendNewMeta(result);
                    saveStoryData();
                    autoSave();
                } else {
                    partialResult = '';
                    typewriterReset();
                    document.getElementById('storyText').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">生成失败，请检查 API Key 后刷新重试</p>';
                }
            } catch (error) {
                partialResult = '';
                console.error('生成开篇失败:', error);
                typewriterReset();
                document.getElementById('storyText').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">生成失败，请重试</p>';
            }

            setLoadingState(false);
        }

        // Render text to HTML paragraphs
        function textToHtml(content) {
            return content
                .split('\n')
                .filter(line => line.trim())
                .map(p => {
                    const clean = p.trim();
                    const isChoice = /^[A-E][\.、:：]/.test(clean) || /^选项[一二三四五]/.test(clean);
                    return `<p class="${isChoice ? 'choice-line' : ''}">${escapeHTML(clean)}</p>`;
                })
                .join('');
        }

        // Display full story (all history segments)
        function displayFullStory() {
            const allContent = currentStory.history.map(h => h.content);
            document.getElementById('storyText').innerHTML = allContent.map((c, i) =>
                '<div id="seg-' + i + '" class="story-segment">' +
                    '<div class="seg-toolbar"><button class="seg-edit-btn" onclick="editSegment(' + i + ')">润色</button></div>' +
                    '<div class="seg-content">' + textToHtml(c) + '</div>' +
                '</div>'
            ).join('<hr class="story-divider">');
        }

        // ---- Segment editing ----
        function editSegment(index) {
            const seg = currentStory.history[index];
            if (!seg) return;
            const el = document.getElementById('seg-' + index);
            if (!el) return;
            const original = seg.original || seg.content;
            el.innerHTML =
                '<div class="seg-edit-layout">' +
                    '<div class="seg-original-panel">' +
                        '<span class="seg-label">原稿</span>' +
                        '<div class="seg-original-text">' + escapeHTML(original) + '</div>' +
                    '</div>' +
                    '<div class="seg-edited-panel">' +
                        '<span class="seg-label">改稿</span>' +
                        '<textarea id="seg-edit-' + index + '" class="seg-edit-textarea">' + escapeHTML(seg.content) + '</textarea>' +
                    '</div>' +
                '</div>' +
                '<div class="seg-edit-actions">' +
                    '<button class="btn-sm" onclick="resetSegmentToOriginal(' + index + ')">重置为原稿</button>' +
                    '<button class="btn-sm" onclick="cancelSegmentEdit()">取消</button>' +
                    '<button class="btn-sm btn-primary" onclick="saveSegmentEdit(' + index + ')">保存</button>' +
                '</div>';
        }

        function cancelSegmentEdit() {
            displayFullStory();
        }

        function resetSegmentToOriginal(index) {
            const seg = currentStory.history[index];
            if (!seg) return;
            const textarea = document.getElementById('seg-edit-' + index);
            if (textarea) textarea.value = seg.original || seg.content;
        }

        async function saveSegmentEdit(index) {
            const seg = currentStory.history[index];
            if (!seg) return;
            const textarea = document.getElementById('seg-edit-' + index);
            if (!textarea) return;
            const newText = textarea.value.trim();
            if (!newText) { showToast('改稿不能为空'); return; }
            if (newText === seg.content) { displayFullStory(); return; }
            const oldContent = seg.content;
            seg.content = newText;
            if (typeof seg.original === 'undefined') seg.original = oldContent;
            saveStoryData();
            autoSave();
            const original = seg.original || oldContent;
            if (newText !== original) {
                try { await analyzeStyleDiff(original, newText); } catch (e) { console.error('analyzeStyleDiff error:', e); }
            }
            document.getElementById('continueHint').textContent = fmtContinueHint(false);
            displayFullStory();
        }

        // Placeholder for Task 3
        const STYLE_ANALYZER_PROMPT = `你是一位文风分析师。请对比用户提供的原稿与改稿，推断用户的文风偏好，输出一份 JSON 风格档案。只输出合法 JSON，不要任何解释性文字。

JSON 结构：
{
  "voice": {
    "sentence_rhythm": "",
    "tone": "",
    "pacing": ""
  },
  "language": {
    "word_level": "",
    "sensory_bias": [],
    "dialogue_mode": "",
    "metaphor_style": ""
  },
  "character": {
    "inner_thoughts": "",
    "description_rule": ""
  },
  "taboos": [],
  "examples": [
    { "original": "", "edited": "", "rule": "" }
  ]
}

字段说明：
- voice.sentence_rhythm: 句式节奏偏好，如短句凌厉、长句缠绵、整散结合等。
- voice.tone: 整体语气，如冷峻、温情、戏谑、压抑等。
- voice.pacing: 叙事节奏，如快节奏推进、慢镜头描写、张弛有度等。
- language.word_level: 用词层级，如文言化、口语化、书面化、网文感等。
- language.sensory_bias: 感官偏向数组，如视觉、听觉、嗅觉、触觉、味觉。
- language.dialogue_mode: 对话风格，如简洁有力、潜台词丰富、话痨、沉默等。
- language.metaphor_style: 比喻风格，如密集隐喻、白描无喻、生活化比喻等。
- character.inner_thoughts: 内心戏处理方式，如直接呈现、动作暗示、留白等。
- character.description_rule: 人物描写规则，如外貌一笔带过、心理优先、行动定义人设等。
- taboos: 用户改稿中体现出的禁忌或回避，如避免心理描写、不用成语、不出现长句等。
- examples: 从本次对比中提取的典型改写示例，最多 5 条，每条说明改稿相对于原稿遵循了什么规则。

规则：
1. 若某字段无法推断，留空字符串或空数组。
2. 只输出 JSON，不要 markdown 代码块，不要额外文字。
3. 尽量具体，避免泛泛而谈。`;

        async function analyzeStyleDiff(original, edited) {
            try {
                const config = getApiConfig();
                if (!config.apiKey) {
                    showToast('请先在首页设置 API Key');
                    return;
                }
                const userPrompt = `<原稿>\n${original}\n\n<改稿>\n${edited}\n\n请输出 JSON 风格档案。`;
                const raw = await callDeepSeek(userPrompt, STYLE_ANALYZER_PROMPT);
                if (!raw || !raw.trim()) {
                    showToast('文风学习失败：API 无返回');
                    return;
                }
                const freshProfile = parseStyleJson(raw);
                if (!freshProfile) {
                    showToast('文风学习失败：解析结果异常');
                    return;
                }
                const oldProfile = currentStory.styleProfile || { voice: {}, language: {}, character: {}, taboos: [], examples: [] };
                currentStory.styleProfile = mergeStyleProfile(oldProfile, freshProfile);
                saveStoryData();
                renderStyleProfile();
                showToast('文风已学习');
            } catch (e) {
                console.error('analyzeStyleDiff error:', e);
                showToast('文风学习失败，请稍后重试');
            }
        }

        function parseStyleJson(raw) {
            if (!raw) return null;
            let text = raw.trim();
            // Remove markdown code block fences
            if (text.startsWith('```json')) text = text.slice(7);
            else if (text.startsWith('```')) text = text.slice(3);
            if (text.endsWith('```')) text = text.slice(0, -3);
            text = text.trim();
            try {
                return JSON.parse(text);
            } catch (e) {
                // Fallback: extract first {...} block
                const match = text.match(/\{[\s\S]*\}/);
                if (match) {
                    try {
                        return JSON.parse(match[0]);
                    } catch (e2) {
                        return null;
                    }
                }
                return null;
            }
        }

        function mergeStyleProfile(old, fresh) {
            const merged = {
                voice: { ...(old.voice || {}), ...(fresh.voice || {}) },
                language: { ...(old.language || {}), ...(fresh.language || {}) },
                character: { ...(old.character || {}), ...(fresh.character || {}) },
                taboos: Array.from(new Set([...(old.taboos || []), ...(fresh.taboos || [])])),
                examples: [...(old.examples || []), ...(fresh.examples || [])].slice(-10)
            };
            return merged;
        }

        function renderStyleProfile() {
            const list = document.getElementById('styleList');
            if (!list) return;
            const profile = currentStory.styleProfile || { voice: {}, language: {}, character: {}, taboos: [], examples: [] };
            if (isEmptyProfile(profile)) {
                list.innerHTML = '<div class="style-empty">暂无文风记录<br>润色任意段落后将在此显示</div>';
                return;
            }
            let html = '';
            if (profile.voice && Object.keys(profile.voice).length > 0) {
                html += '<div class="style-group"><div class="style-group-title">语气与节奏</div>' + renderKeyValues(profile.voice) + '</div>';
            }
            if (profile.language && Object.keys(profile.language).length > 0) {
                html += '<div class="style-group"><div class="style-group-title">语言偏好</div>' + renderKeyValues(profile.language) + '</div>';
            }
            if (profile.character && Object.keys(profile.character).length > 0) {
                html += '<div class="style-group"><div class="style-group-title">人物刻画</div>' + renderKeyValues(profile.character) + '</div>';
            }
            if (profile.taboos && profile.taboos.length > 0) {
                html += '<div class="style-group"><div class="style-group-title">禁忌</div>' +
                    '<div class="style-kv-row"><span class="style-kv-value">' + escapeHTML(profile.taboos.join('、')) + '</span></div></div>';
            }
            if (profile.examples && profile.examples.length > 0) {
                html += '<div class="style-group"><div class="style-group-title">改写示例</div>';
                profile.examples.forEach(ex => {
                    html += '<div class="style-example">' +
                        '<div class="style-example-label">原句</div>' +
                        '<div class="style-example-text">' + escapeHTML(ex.original || '') + '</div>' +
                        '<div class="style-example-label">改句</div>' +
                        '<div class="style-example-text">' + escapeHTML(ex.edited || '') + '</div>' +
                        '<div class="style-example-rule">规则：' + escapeHTML(ex.rule || '') + '</div>' +
                        '</div>';
                });
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function renderKeyValues(obj) {
            if (!obj || typeof obj !== 'object') return '';
            return Object.entries(obj).map(([k, v]) => {
                let display = '';
                if (Array.isArray(v)) display = v.join('、');
                else display = String(v ?? '');
                if (!display) return '';
                return '<div class="style-kv-row"><span class="style-kv-key">' + escapeHTML(k) + '</span><span class="style-kv-value">' + escapeHTML(display) + '</span></div>';
            }).filter(Boolean).join('');
        }

        function isEmptyProfile(p) {
            if (!p) return true;
            const hasVoice = p.voice && Object.keys(p.voice).length > 0 && Object.values(p.voice).some(v => v && (!Array.isArray(v) || v.length > 0));
            const hasLanguage = p.language && Object.keys(p.language).length > 0 && Object.values(p.language).some(v => v && (!Array.isArray(v) || v.length > 0));
            const hasCharacter = p.character && Object.keys(p.character).length > 0 && Object.values(p.character).some(v => v && (!Array.isArray(v) || v.length > 0));
            const hasTaboos = p.taboos && p.taboos.length > 0;
            const hasExamples = p.examples && p.examples.length > 0;
            return !hasVoice && !hasLanguage && !hasCharacter && !hasTaboos && !hasExamples;
        }

        function resetStyleProfile() {
            if (!confirm('确定要清空文风档案吗？此操作不可撤销。')) return;
            currentStory.styleProfile = { voice: {}, language: {}, character: {}, taboos: [], examples: [] };
            saveStoryData();
            renderStyleProfile();
            document.getElementById('continueHint').textContent = fmtContinueHint(false);
            showToast('文风档案已清空');
        }

        function formatStylePrompt(profile) {
            if (isEmptyProfile(profile)) return '';
            let parts = [];
            if (profile.voice && Object.keys(profile.voice).length > 0) {
                parts.push('【语气与节奏】' + Object.entries(profile.voice).map(([k, v]) => k + '：' + v).join('；'));
            }
            if (profile.language && Object.keys(profile.language).length > 0) {
                const langEntries = Object.entries(profile.language).map(([k, v]) => {
                    const display = Array.isArray(v) ? v.join('、') : String(v);
                    return k + '：' + display;
                }).join('；');
                parts.push('【语言偏好】' + langEntries);
            }
            if (profile.character && Object.keys(profile.character).length > 0) {
                parts.push('【人物刻画】' + Object.entries(profile.character).map(([k, v]) => k + '：' + v).join('；'));
            }
            if (profile.taboos && profile.taboos.length > 0) {
                parts.push('【禁忌】' + profile.taboos.join('、'));
            }
            if (profile.examples && profile.examples.length > 0) {
                const exLines = profile.examples.map((ex, i) => {
                    return (i + 1) + '. 原句：' + (ex.original || '') + ' → 改句：' + (ex.edited || '') + '（规则：' + (ex.rule || '') + '）';
                }).join('\n');
                parts.push('【改写示例】\n' + exLines);
            }
            return '【用户文风约束】\n' + parts.join('\n');
        }

        // Display story content: all previous history + current streaming text
        function displayStoryContent(newText) {
            typewriterFeed(newText);
        }

        // ---- Typewriter engine (character-by-character display) ----
        let _tw = { raf: null, text: '', pos: 0, speed: 1 };

        function typewriterFeed(text) {
            _tw.text = text;
            if (!_tw.raf) _tw.raf = requestAnimationFrame(typewriterTick);
        }

        function typewriterTick() {
            if (_tw.pos >= _tw.text.length) {
                cancelAnimationFrame(_tw.raf);
                _tw.raf = null;
                return;
            }
            // Advance 1-2 chars per frame depending on speed
            _tw.pos = Math.min(_tw.pos + _tw.speed, _tw.text.length);
            const partial = _tw.text.slice(0, _tw.pos);
            const prevHtml = currentStory.history.map(h => textToHtml(h.content)).join('<hr class="story-divider">');
            const newHtml = textToHtml(partial);
            const divider = currentStory.history.length > 0 ? '<hr class="story-divider">' : '';
            document.getElementById('storyText').innerHTML = prevHtml + divider + newHtml;
            const storyEl = document.querySelector('.story-content');
            storyEl.scrollTop = storyEl.scrollHeight;
            _tw.raf = requestAnimationFrame(typewriterTick);
        }

        // Continue story
        async function continueStory() {
            if (isLoading) return;

            const customInput = document.getElementById('customInput').value.trim();
            let userChoice = '';

            if (customInput) {
                userChoice = customInput;
            } else {
                userChoice = '继续发展剧情';

            setLoadingState(true, '正在续写...');
            showLoading();

            const config = getApiConfig();
            if (!config.apiKey) {
                showToast('请先在首页设置 API Key');
                setLoadingState(false);
                return;
            }

            const storySoFar = currentStory.history.map(h => h.content).join('\n\n');

            const styleBlock = formatStylePrompt(currentStory.styleProfile);
            const prompt = `${getPrefPrompt()}${styleBlock}
用户选择：${userChoice}

世界：${currentStory.worldTitle}（${currentStory.worldTags.join('、')}）
主角：${currentStory.protagonist}${currentStory.protagonistDesc ? ' — ' + currentStory.protagonistDesc : ''}
叙事：${currentStory.narrative}

请继续故事，接续以下内容：
${storySoFar}

要求：

3. 文字直白有张力
4. 结尾停在新的关键节点，提供3个选项`;

            const systemPrompt = renderPrompt(getStoryPrompt(), {
                worldTitle: currentStory.worldTitle,
                worldDesc: currentStory.worldDesc || '',
                protagonist: currentStory.protagonist,
                goldenFinger: currentStory.goldenFinger || '无'
            });

            try {
                const result = await callDeepSeek(prompt, systemPrompt, (text) => {
                    partialResult = text;

                });

                if (result) {
                    partialResult = '';
                    typewriterReset();
                    const displayText = ensureCompleteSentence(stripStructuredMeta(result));
                    const segment = {
                        content: displayText,
                        timestamp: Date.now()
                    };
                    currentStory.history.push(segment);
                    displayFullStory();
                    document.getElementById('customInput').value = '';
                    document.getElementById('continueHint').textContent = fmtContinueHint(false);

                typewriterReset();
                showToast('继续创作失败，请稍后再试');
            }

            setLoadingState(false);
        }

        // API functions (simplified - would need full implementation)
        async function callDeepSeek(prompt, systemPrompt, onChunk) {
            const config = getApiConfig();
            if (!config.apiKey) return null;

            abortController = new AbortController();

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.8,
                        stream: true
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) throw new Error('API error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let result = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content || '';
                                if (content) {
                                    result += content;
                                    if (onChunk) onChunk(result);
                                }
                            } catch (e) {}
                        }
                    }
                }
                return result;
            } catch (error) {
                if (error.name === 'AbortError') return null;
                console.error('DeepSeek API错误:', error);
                return null;
            } finally {
                abortController = null;
            }
        }

        function getApiConfig() {

        // ==================== Structured Metadata Parsing & Rendering ====================

        // Ensure text ends with a complete sentence (always cut to last period)
        function ensureCompleteSentence(text) {
            const lastPeriod = Math.max(
                text.lastIndexOf('。'),
                text.lastIndexOf('！'),
                text.lastIndexOf('？')
            );
            if (lastPeriod > 0) {
                return text.slice(0, lastPeriod + 1);
            }
            return text;
        }

        // Strip structured metadata from display text
        function stripStructuredMeta(text) {
            const idxPlot = text.indexOf('【剧情打点】');
            const idxOutline = text.indexOf('【提纲节点】');
            const idxClues = text.indexOf('【线索追踪】');
            const idxChars = text.indexOf('【人物卡】');
            const cutAt = [idxPlot, idxOutline, idxClues, idxChars].filter(i => i > 0);
            if (cutAt.length > 0) {
                return text.slice(0, Math.min(...cutAt)).trim();
            }
            return text.trim();
        }

        // Extract section by markers
        function extractSection(text, startMarker, endMarkers) {
            const start = text.indexOf(startMarker);
            if (start === -1) return '';
            let end = text.length;
            for (const em of endMarkers) {
                const idx = text.indexOf(em, start + startMarker.length);
                if (idx > 0 && idx < end) end = idx;
            }
            return text.slice(start + startMarker.length, end);
        }

        // Parse plot points from new 【剧情打点】format
        function parsePlotPoints(fullText) {
            const points = { outline: [], clues: [], characters: [], relations: [] };
            const section = extractSection(fullText, '【剧情打点】', ['【提纲节点】', '【线索追踪】', '【人物卡】']);
            if (!section) return points;

            let currentSub = '';
            section.split('\n').forEach(line => {
                line = line.trim();
                if (!line) return;
                if (line === '[提纲节点]') { currentSub = 'outline'; return; }
                if (line === '[线索节点]') { currentSub = 'clues'; return; }
                if (line === '[人物节点]') { currentSub = 'characters'; return; }
                if (line === '[关系边]') { currentSub = 'relations'; return; }

                const parts = line.split('|').map(s => s.trim());
                if (currentSub === 'outline' && parts.length >= 3) {
                    points.outline.push({
                        type: parts[0],
                        importance: parts[1],
                        summary: parts[2],
                        _new: true
                    });
                } else if (currentSub === 'clues' && parts.length >= 3) {
                    points.clues.push({
                        name: parts[0],
                        stateChange: parts[1],
                        desc: parts[2],
                        importance: parts[3] || 'normal',
                        _new: true
                    });
                } else if (currentSub === 'characters' && parts.length >= 4) {
                    points.characters.push({
                        id: parts[0],
                        name: parts[1],
                        firstAppear: parseInt(parts[2]) || 0,
                        tag: parts[3],
                        desc: parts[4] || '',
                        _new: true
                    });
                } else if (currentSub === 'relations' && parts.length >= 4) {
                    points.relations.push({
                        source: parts[0],
                        target: parts[1],
                        type: parts[2],
                        strength: parseInt(parts[3]) || 1,
                        scene: parts[4] || '',
                        _new: true
                    });
                }
            });
            return points;
        }

        // Fallback: parse old format 【提纲节点】/【线索追踪】/【人物卡】
        function parseStructuredMeta(fullText) {
            const outline = [], clues = [], chars = [];

            const outlineSection = extractSection(fullText, '【提纲节点】', ['【线索追踪】', '【人物卡】']);
            if (outlineSection) {
                const lines = outlineSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/第\s*\d+\s*节点[：:]\s*(.+)/);
                    if (m && m[1].trim()) outline.push(m[1].trim());
                }
            }

            const cluesSection = extractSection(fullText, '【线索追踪】', ['【人物卡】', '【提纲节点】']);
            if (cluesSection) {
                const lines = cluesSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/线索[\w\d]*[：:]\s*([^|]+)\|\s*([^|]+)\|\s*(.+)/);
                    if (m) {
                        clues.push({ name: m[1].trim(), state: m[2].trim(), desc: m[3].trim() });
                    }
                }
            }

            const charsSection = extractSection(fullText, '【人物卡】', ['【提纲节点】', '【线索追踪】']);
            if (charsSection) {
                const lines = charsSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/-\s*角色名[：:]\s*([^|]+)\|\s*身份[：:]\s*([^|]+)\|\s*性格[：:]\s*([^|]+)\|\s*关键行动[：:]\s*(.+)/);
                    if (m) {
                        chars.push({ name: m[1].trim(), identity: m[2].trim(), personality: m[3].trim(), action: m[4].trim() });
                    }
                }
            }

            return { outline, clues, chars };
        }

        function appendNewMeta(result) {
            const plotPoints = parsePlotPoints(result);
            let hasNewData = false;

            const segIdx = currentStory.history.length - 1;
            if (plotPoints.outline.length > 0) {
                plotPoints.outline.forEach(o => o._seg = segIdx);
                storyOutline.push(...plotPoints.outline);
                renderOutline();
                renderTimeline();
                hasNewData = true;
            }
            if (plotPoints.clues.length > 0) {
                plotPoints.clues.forEach(c => c._seg = segIdx);
                plotPoints.clues.forEach(newClue => {
                    const exist = storyClues.find(c => c.name === newClue.name);
                    if (exist) { exist.stateChange = newClue.stateChange;
                        exist.desc = newClue.desc;
                        exist.importance = newClue.importance; }
                    else { storyClues.push(newClue); }
                });
                renderClues();
                renderTimeline();
                hasNewData = true;
            }
            if (plotPoints.characters.length > 0) {
                plotPoints.characters.forEach(newChar => {
                    const exist = characterCards.find(c => c.id === newChar.id);
                    if (exist) {
                        exist.freq = (exist.freq || 1) + 1;
                        if (!exist.tag || exist.tag === '配角') exist.tag = newChar.tag || exist.tag;
                    } else {
                        characterCards.push({ ...newChar, freq: 1, _new: true });
                    }
                });
                renderChars();
                renderRelationGraph();
                setTimeout(() => { characterCards.forEach(c => delete c._new); }, 3500);
                hasNewData = true;
            }
            if (plotPoints.relations.length > 0) {
                plotPoints.relations.forEach(newRel => {
                    const exist = characterRelations.find(r => r.source === newRel.source && r.target === newRel.target);
                    if (!exist) { characterRelations.push({ ...newRel, _new: true }); }
                });
                renderRelationGraph();
                setTimeout(() => { characterRelations.forEach(r => delete r._new); }, 3500);
                hasNewData = true;
            }
            if (!hasNewData) {
                const meta = parseStructuredMeta(result);
                if (meta.outline.length > 0) {
                    storyOutline.push(...meta.outline.map(s => ({ type: '节点', importance: 'normal', summary: s, _new: true })));
                    renderOutline();
                    renderTimeline();
                }
                if (meta.clues.length > 0) {
                    meta.clues.forEach(newClue => {
                        const exist = storyClues.find(c => c.name === newClue.name);
                        if (exist) { exist.state = newClue.state;
                            exist.desc = newClue.desc; }
                        else { storyClues.push({ ...newClue, stateChange: '新线索', importance: 'normal', _new: true }); }
                    });
                    renderClues();
                    renderTimeline();
                }
                if (meta.chars.length > 0) {
                    meta.chars.forEach(newChar => {
                        const exist = characterCards.find(c => c.name === newChar.name);
                        if (!exist) { characterCards.push({ ...newChar, new: true }); }
                    });
                    renderChars();
                    renderRelationGraph();
                    setTimeout(() => { characterCards.forEach(c => delete c.new); }, 3500);
                }
            }
        }

        function renderOutline() {
            const list = document.getElementById('outlineList');
            if (!list) return;
            if (storyOutline.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无提纲节点</div>'; return; }
            list.innerHTML = storyOutline.map((n, i) => {
                const imp = n.importance || 'normal';
                const seg = n._seg != null ? n._seg : i;
                return '<div class="ol-item" onclick="scrollToSeg(' + seg + ')"><span class="ol-dot ' + imp + '"></span><span>' + escapeHTML(n.summary || n.type || '') + '</span></div>';
            }).join('');
        }

        function renderClues() {
            const list = document.getElementById('cluesList');
            if (!list) return;
            if (storyClues.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无线索</div>'; return; }
            list.innerHTML = storyClues.map(c => {
                const s = c.stateChange || c.state || '';
                return '<div class="cl-item"><span class="cl-dot"></span><span><span class="cl-name">' + escapeHTML(c.name) + '</span>' + escapeHTML(c.desc) + '</span><span class="cl-state">' + escapeHTML(s) + '</span></div>';
            }).join('');
        }

        function renderChars() {
            const list = document.getElementById('charsList');
            if (!list) return;
            let html = '';
            // Relationship graph at top, collapsible
            if (characterRelations.length > 0 || Object.keys(characterCards).length > 1) {
                const graphSvg = buildRelationGraphSvg();
                if (graphSvg) {
                    html += '<details style="margin-bottom:8px;"><summary style="cursor:pointer;font-size:0.78rem;color:var(--text-secondary);">人物关系图 ▸</summary>';
                    html += '<div class="ch-graph" style="margin-top:8px;">' + graphSvg + '</div></details>';
                }
            }
            if (currentStory.protagonist) {
                html += '<div class="ch-item"><span class="ch-avatar">主</span><span class="ch-name">' + escapeHTML(currentStory.protagonist) + '</span><span class="ch-rel">主角</span></div>';
            }
            const sorted = [...characterCards].sort((a, b) => (b.freq || 0) - (a.freq || 0));
            sorted.forEach(c => {
                if (c.tag !== '主角') {
                    const ini = c.name ? c.name[0] : '?';
                    const tagLabel = (c.tag || c.relation || '') + ((c.freq || 0) > 1 ? ' ×' + c.freq : '');
                    html += '<div class="ch-item"><span class="ch-avatar">' + escapeHTML(ini) + '</span><span class="ch-name">' + escapeHTML(c.name) + '</span><span class="ch-rel">' + escapeHTML(tagLabel) + '</span></div>';
                }
            });
            list.innerHTML = html || '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无角色</div>';
        }

        function renderTimeline() {
            const container = document.getElementById('timelineNodes');
            const track = document.getElementById('timelineTrack');
            if (!container || !track) return;

            let nodes = currentSidebarTab === 'outline' ? storyOutline : storyClues;
            if (!nodes.length) { container.innerHTML = ''; return; }

            const h = track.clientHeight;
            const s = h / (nodes.length + 1);
            const cx = 16; // timeline center (32px / 2)

            let svg = '<svg style="position:absolute;top:0;left:0;width:32px;height:' + h + 'px;overflow:visible;">';
            nodes.forEach((n, i) => {
                const y = s * (i + 1);
                if (i > 0) {
                    const py = s * i;
                    svg += '<line x1="' + cx + '" y1="' + py + '" x2="' + cx + '" y2="' + y + '" stroke="#e5e0d8" stroke-width="1" />';
                }
                const imp = n.importance || 'normal';
                const cm = { critical: '#c97a7a', major: '#c9a060', normal: '#b0a99e' };
                svg += '<circle cx="' + cx + '" cy="' + y + '" r="5" fill="' + cm[imp] + '" stroke="#fff" stroke-width="2" />';
            });
            svg += '</svg>';

            const overlays = nodes.map((n, i) => {
                const y = s * (i + 1);
                const title = escapeHTML(n.summary || n.name || n.desc || '');
                const seg = n._seg != null ? n._seg : i;
                return '<div style="position:absolute;left:0;top:' + y + 'px;width:100%;height:16px;transform:translateY(-8px);cursor:pointer;" onclick="scrollToSeg(' + seg + ')" onmouseenter="showTT(this,\'' + title + '\')" onmouseleave="hideTT()"></div>';
            }).join('');
            container.innerHTML = svg + overlays;
        }

        function buildRelationGraphSvg() {
            const nodeMap = {};
            if (currentStory.protagonist) {
                nodeMap['protagonist'] = { id: 'protagonist', name: currentStory.protagonist, isP: true };
            }
            characterCards.forEach(c => {
                if (c.id) nodeMap[c.id] = { id: c.id, name: c.name, isP: false, tag: c.tag || '' };
            });
            const relLines = characterRelations.filter(r => nodeMap[r.source] && nodeMap[r.target]);
            if (Object.keys(nodeMap).length < 2) return '';

            const centerX = 24, centerY = 150, radius = 80;
            const nodes = Object.values(nodeMap);
            const n = nodes.length;
            const nodePos = {};
            nodes.forEach((node, i) => {
                if (node.isP) { nodePos[node.id] = { x: centerX, y: centerY }; }
                else {
                    const angle = (2 * Math.PI * i) / Math.max(n - 1, 1) - Math.PI / 2;
                    nodePos[node.id] = { x: centerX + radius * Math.cos(angle), y: centerY + radius * Math.sin(angle) };
                }
            });

            let svg = '<svg width="200" height="300" style="overflow:visible;">';
            relLines.forEach(r => {
                const s = nodePos[r.source], t = nodePos[r.target];
                if (s && t) svg += '<line x1="' + s.x + '" y1="' + s.y + '" x2="' + t.x + '" y2="' + t.y + '" stroke="#d9d2c4" stroke-width="' + (r.strength || 1) + '" />';
            });
            nodes.forEach(node => {
                const pos = nodePos[node.id];
                svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + (node.isP ? 8 : 5) + '" fill="' + (node.isP ? '#c4971e' : '#8e867d') + '" stroke="#fff" stroke-width="1.5" />';
                svg += '<text x="' + (pos.x + (node.isP ? 12 : 8)) + '" y="' + (pos.y + 4) + '" font-size="10" fill="#5c554c" font-family="inherit">' + escapeHTML(node.name) + '</text>';
            });
            svg += '</svg>';
            return svg;
        }

        function renderRelationGraph() {
            const svg = buildRelationGraphSvg();
            if (!svg) return;
            const exist = document.querySelector('.ch-graph');
            if (exist) exist.remove();
            const list = document.getElementById('charsList');
            if (list && !list.querySelector('.ch-graph')) {
                list.insertAdjacentHTML('afterbegin', '<div class="ch-graph">' + svg + '</div>');
            }
        }

        function showTT(el, text) {
            let tt = document.getElementById('nodeTooltip');
            if (!tt) { tt = document.createElement('div');
                tt.id = 'nodeTooltip';
                tt.style.cssText = 'position:fixed;background:#fff;border:1px solid #e0d9cf;border-radius:8px;padding:8px 12px;font-size:0.75rem;color:#5c554c;z-index:200;max-width:180px;pointer-events:none;opacity:0;transition:opacity 0.2s;';
                document.body.appendChild(tt); }
            tt.textContent = text;
            const r = el.getBoundingClientRect();
            tt.style.left = (r.left - 190) + 'px';
            tt.style.top = (r.top + r.height / 2 - 16) + 'px';
            tt.style.opacity = '1';
        }
        function hideTT() { const tt = document.getElementById('nodeTooltip'); if (tt) tt.style.opacity = '0'; }

        function scrollToSeg(idx) {
            const el = document.getElementById('seg-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function switchTab(tab) {
            currentSidebarTab = tab;
            document.querySelectorAll('.s-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.querySelectorAll('.sb-pane').forEach(p => p.classList.toggle('active', p.id === 'sb' + tab.charAt(0).toUpperCase() + tab.slice(1)));
            if (tab === 'characters') { renderChars();
                renderRelationGraph(); }
            else { renderTimeline(); }
        }

        // ==================== End Structured Metadata ====================

        // Init
        init();
    </script>
</body>
</html>
