<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即墨 - 故事创作</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 宣纸底色系 */
            --paper-new: oklch(98% 0.006 95);
            --paper-aged: oklch(96% 0.010 92);
            --paper-dark: oklch(92% 0.014 88);
            /* 墨分五色 */
            --ink-light: oklch(65% 0.018 85);
            --ink-mid: oklch(40% 0.024 80);
            --ink-heavy: oklch(20% 0.030 70);
            --ink-black: oklch(15% 0.032 60);
            /* 朱砂唯一点缀 */
            --seal: oklch(48% 0.16 28);
            --seal-dark: oklch(38% 0.18 22);
            /* 边框 */
            --border: oklch(82% 0.008 90);
            --border-dark: oklch(60% 0.012 82);
            /* 语义别名 — 指向宣纸/墨色体系 */
            --bg-primary: var(--paper-new);
            --bg-secondary: var(--paper-aged);
            --bg-tertiary: var(--paper-dark);
            --surface-card: rgba(255, 255, 255, 0.92);
            --surface-card-soft: rgba(255, 255, 255, 0.78);
            --surface-overlay: rgba(45, 42, 38, 0.6);
            --text-primary: var(--ink-black);
            --text-secondary: var(--ink-mid);
            --text-muted: var(--ink-light);
            --text-inverse: #ffffff;
            --accent-primary: var(--seal);
            --accent-secondary: var(--seal-dark);
            --accent-tertiary: oklch(55% 0.12 25);
            --accent-world: oklch(50% 0.10 230);
            --accent-protagonist: oklch(50% 0.10 40);
            --accent-narrative: oklch(50% 0.10 140);
            --success: #5a8a50;
            --warning: #c88a3a;
            --error: #b85555;
            --info: #5b7aaa;
            --border-light: var(--border);
            --border-medium: var(--border-dark);
            --topbar-bg: #2c2825;
            --topbar-text: #e8e2d8;
            --shadow-soft: 0 2px 12px rgba(100, 80, 50, 0.07), 0 4px 20px rgba(100, 80, 50, 0.05);
            --shadow-medium: 0 4px 16px rgba(100, 80, 50, 0.10), 0 8px 30px rgba(100, 80, 50, 0.08);
            --shadow-strong: 0 8px 24px rgba(100, 80, 50, 0.14), 0 14px 40px rgba(100, 80, 50, 0.10);
            --shadow-glow: 0 4px 18px rgba(196, 151, 30, 0.35);
            /* 字体 */
            --font-display: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
            /* 间距 */
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 48px;
            --space-xl: 80px;
            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            /* 过渡 */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--paper-new);
            color: var(--ink-light);
            line-height: 1.8;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--topbar-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            color: var(--topbar-text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.22);
            color: #fff;
            border-color: rgba(255,255,255,0.35);
        }
        .story-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--topbar-text);
        }
        .top-right {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }
        .top-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all var(--transition-normal);
            background: rgba(255,255,255,0.1);
            color: var(--topbar-text);
            white-space: nowrap;
        }
        .top-btn:hover {
            background: rgba(255,255,255,0.22);
            color: #fff;
            border-color: rgba(255,255,255,0.35);
        }
        .top-btn:active {
            transform: scale(0.95);
        }
        .top-btn:disabled,
        .btn:disabled {
            opacity: 0.58;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-save { background: rgba(90,138,80,0.95); border-color: rgba(90,138,80,0.6); }
        .btn-export { background: rgba(196,151,30,0.85); border-color: rgba(196,151,30,0.5); }

        /* World Banner */
        .world-banner {
            padding: var(--space-sm) var(--space-md);
            margin-bottom: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }
        .world-banner-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .world-name {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .world-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            display: inline-block;
            padding: 2px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .character-info {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }
        /* Container — story panel, always centered, max-width 560px */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 560px;
            padding: 16px 0 0;
            min-height: 0;
            overflow: hidden;
            transition: max-width 0.3s ease, padding 0.3s ease;
        }

        /* ===== Timeline（垂直线+节点）===== */
        .story-timeline {
            width: 48px;
            flex-shrink: 0;
            position: relative;
            background: transparent;
        }
        .timeline-track {
            position: absolute;
            left: 50%;
            top: 12px;
            bottom: 12px;
            width: 1px;
            background: #e5e0d8;
            transform: translateX(-50%);
        }
        .timeline-nodes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .timeline-node {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid #fff;
            z-index: 2;
        }
        .timeline-node:hover {
            width: 16px;
            height: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .node-critical { background: var(--seal); }
        .node-major { background: var(--ink-mid); }
        .node-normal { background: var(--ink-light); }

        /* ===== Sidebar（右侧面板）===== */
        .story-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--paper-aged);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-tabs {
            display: flex;
            gap: 2px;
            padding: 12px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .s-tab {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .s-tab:hover { background: var(--bg-secondary); color: var(--text-secondary); }
        .s-tab.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 600; }

        .sidebar-body { flex: 1; overflow-y: auto; min-height: 0; }
        .sb-pane { display: none; padding: 12px; }
        .sb-pane.active { display: block; }
        .sb-list { display: flex; flex-direction: column; gap: 8px; }

        /* Sidebar list items */
        .ol-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            cursor: pointer;
        }
        .ol-item:hover { color: var(--text-primary); }
        .ol-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .ol-dot.critical { background: #c97a7a; }
        .ol-dot.major { background: #c9a060; }
        .ol-dot.normal { background: #b0a99e; }

        .cl-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .cl-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-world);
            flex-shrink: 0;
            margin-top: 6px;
        }
        .cl-state {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-muted);
            margin-top: 2px;
        }
        .cl-name { font-weight: 600; color: var(--text-primary); margin-right: 6px; }

        .ch-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .ch-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }
        .ch-name { font-weight: 600; color: var(--text-primary); }
        .ch-rel { font-size: 0.7rem; color: var(--text-muted); }

        .ch-graph {
            margin-top: 12px;
            padding: 12px;
            background: #fcfbf9;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .ch-graph svg { overflow: visible; }

        /* Story Content */
        .story-content {
            flex: 1;
            background: var(--paper-new);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 12px;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .story-text {
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--text-primary);
        }
        .story-text p {
            margin-bottom: 1.1em;
            text-indent: 2em;
        }
        .story-text p:first-child {
            margin-top: 0;
        }
        .story-text p:last-child {
            margin-bottom: 0;
        }
        .story-text .choice-line {
            text-indent: 0;
            color: var(--accent-tertiary);
            font-weight: 600;
            margin: 1.2em 0 0.6em;
            padding-left: 1em;
            border-left: 3px solid var(--accent-primary);
        }
        .story-divider {
            border: none;
            margin: 36px 0;
            text-align: center;
            height: auto;
            overflow: visible;
            position: relative;
        }
        .story-divider::before {
            content: '';
            position: absolute;
            left: 20%;
            right: 20%;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-medium), transparent);
        }
        .story-divider::after {
            content: '◆';
            display: block;
            position: relative;
            color: var(--border-dark);
            font-size: 0.7rem;
            background: var(--surface-card);
            width: 32px;
            margin: 0 auto;
            letter-spacing: 0;
        }
        .story-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px;
            color: var(--text-muted);
        }
        .loading-dots {
            display: flex;
            gap: 4px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 固定底栏 */
        .bottom-action-bar {
            flex-shrink: 0;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 14px 20px;
            box-shadow: 0 -2px 12px rgba(100, 80, 50, 0.07);
            z-index: 90;
        }
        .bottom-action-inner {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .bottom-action-inner .custom-input {
            flex: 1;
            min-height: 42px;
            max-height: 100px;
            padding: 10px 14px;
            font-size: 0.9rem;
            resize: none;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-family: inherit;
            background: var(--bg-primary);
            transition: all var(--transition-fast);
        }
        .bottom-action-inner .custom-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(201, 168, 108, 0.15);
        }
        .bottom-action-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .bottom-action-btns .btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .bottom-continue-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 6px;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all var(--transition-normal);
        }
        .btn-primary {
            background: var(--ink-heavy);
            color: var(--paper-new);
            border: none;
            border-radius: 4px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-primary:hover { background: var(--ink-black); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled {
            background: var(--border-dark);
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-medium);
        }
        .btn-secondary:hover {
            background: var(--accent-tertiary);
            color: var(--text-inverse);
            border-color: var(--accent-tertiary);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }

        /* Continue indicator */
        .continue-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .story-status {
            flex-shrink: 0;
            min-height: 1.2em;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 4px;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 16px);
            padding: 10px 16px;
            max-width: min(520px, calc(100vw - 32px));
            background: rgba(45, 42, 38, 0.92);
            color: #fff;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-strong);
            font-size: 0.88rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal), transform var(--transition-normal);
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-tertiary); }

        /* API Modal */
        .api-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .api-modal.show {
            display: flex;
        }
        .api-modal-content {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .api-modal-content h3 {
            margin: 0 0 16px;
            font-family: var(--font-display);
            color: var(--text-primary);
        }
        .api-modal-body {
            margin-bottom: 20px;
        }
        .api-modal-body label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .api-modal-body input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .api-modal-hint {
            margin: 8px 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .api-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Responsive - Mobile */
        @media (max-width: 640px) {
            .container { padding: 8px 16px 0; }
            .top-bar { gap: 10px; align-items: flex-start; }
            .top-left { min-width: 0; }
            .story-title { font-size: 1.1rem; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .story-content { padding: 24px 20px; }
            .world-banner { padding: var(--space-sm) 14px; }
            .world-banner-header { flex-direction: column; }
            .bottom-action-bar { padding: 10px 14px; }
            .bottom-action-inner { flex-direction: column; gap: 8px; }
            .bottom-action-btns { width: 100%; }
            .bottom-action-btns .btn { flex: 1; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <a href="index.html" class="back-btn">← 返回</a>
            <span class="story-title" id="storyTitle">故事创作</span>
        </div>
        <div class="top-right">
            <button class="top-btn" onclick="toggleApiPanel()">API设置</button>
            <a href="admin.html" class="top-btn">提示词管理</a>
            <button class="top-btn btn-save" onclick="saveStory()">保存</button>
            <button class="top-btn btn-export" onclick="exportStory()">导出</button>
        </div>
    </div>

    <!-- API Settings Modal -->
    <div id="apiModal" class="api-modal">
        <div class="api-modal-content">
            <h3>API 设置</h3>
            <div class="api-modal-body">
                <label for="apiKeyInput">DeepSeek API Key</label>
                <input type="password" id="apiKeyInput" placeholder="请输入 API Key" />
                <p class="api-modal-hint">API Key 将保存在本地浏览器中</p>
            </div>
            <div class="api-modal-actions">
                <button class="btn" onclick="toggleApiPanel()">取消</button>
                <button class="btn btn-primary" onclick="saveApiKey()">保存</button>
            </div>
        </div>
    </div>

    <div class="main-area">
        <div class="container">
            <!-- World Info Banner -->
            <div class="world-banner">
                <div class="world-banner-header">
                    <div class="world-name" id="worldTitle">加载中...</div>
                    <div class="world-tags" id="worldTags"></div>
                </div>
                <div class="character-info">
                    <span id="characterInfo">主角：加载中...</span>
                    <span id="narrativeInfo">叙事：加载中...</span>
                </div>
            </div>

            <!-- Story Content -->
            <div class="story-content">
                <div id="storyText" class="story-text">
                    <div class="story-loading">
                        <div class="loading-dots">
                            <span></span><span></span><span></span>
                        </div>
                        <span>故事加载中...</span>
                    </div>
                </div>
            </div>

        <!-- Timeline strip -->

    <!-- 固定底栏 -->

    <script>
        // Global state
        let currentStory = {
            worldTitle: '',
            worldDesc: '',
            worldTags: [],
            protagonist: '',
            protagonistTags: [],
            goldenFinger: '',
            narrative: '',
            history: []
        };
        let isLoading = false;

        // Sidebar & structured metadata state
        let storyOutline = [];
        let storyClues = [];
        let characterCards = [];
        let characterRelations = [];
        let currentSidebarTab = 'outline';
        let protagonistStyle = ''; // 'chinese' or 'western'
        let personalityFramework = {}; // chineseCategories or westernCategories

        // System prompts (from index.html)
        const systemPrompts = {
            story: `你是专业网文作家。核心理念：用户是灵魂，AI是笔。用户不需要会写，只需要会选。AI负责把用户的选择，用专业的方式落到纸上。

【AI核心能力】
1. 考据隐身：虚构设定锚定真实知识体系，只驱动底层逻辑
2. 结构守护：伏笔不漏，人设不塌，时间线不出bug
3. 多领域即时调度：需要什么知识调什么知识，不中断写作流
4. 多维并行推演：同时推演主角、对手、旁观者、环境、伏笔五条线
5. 文风瞬时适配：根据设定自动匹配叙事温度和留白比例
6. 持续输出零衰减：保持一致性，保持产出节奏

【故事机制】
第一步：世界观已生成
第二步：以第三人称开篇，直接进入冲突。用户在阅读中进入世界
第三步：每个关键节点，提供多个选项，每个选项指向不同剧情走向
第四步：用户选择后，沿选定方向推进叙事
第五步：新的节点，新的选项，形成持续的分支叙事

【写作八条铁律】
1. 钩子：首句必须有异常、不安或未解之谜
2. 感受优先：情绪在前，用动作和对话暗示，不直接描写心理
3. 节奏控制：每千字必须有情绪转折或情节推高。平静段落必须有暗流
4. 规则要演：每引入设定，必须立刻有角色因此改变命运。空讲设定等于没写
5. 行动即人设：不给角色贴性格标签。只写他在关键时刻做了什么选择
6. 爽点兑现：每章至少兑现一种底层爽感——翻身、解密、占有、自由、活下来、守护
7. 语言透明：删优先级：形容词 > 可改成动作的心理描写 > 炫技句子
8. 考据隐身：所有真实参照只驱动底层逻辑，不在正文里站到前台
9. 克制数字：除非剧情必须体现精确技术参数（如破解密码、医疗数据），否则不堆砌具体数值。用感官和动作代替测量——写"水滴悬在半空，缓缓往上爬了一截"，不写"停滞了四秒，朝上移动了大约三厘米"
10. 句尾完整：每段必须在句号处结束，不得在逗号、从句、从属结构处截断。如果字数限制在流中到达，停在最后一个完整句子的句号处。

【读者心理钩子 — 压抑→释放机制】
每段剧情必须至少触发一种读者心理需求。先制造压抑端，再兑现释放端。压抑越深，释放越爽。

1. 正义需求：被冤枉/功劳被窃取 → 真相大白/恶人打脸 → 越是不公越想看"还我公道"
2. 安全需求：面临危险/倒计时压力 → 化险为夷/绝处逢生 → 害怕失去→紧张→得救→爽
3. 求知需求：谜题未解/伏笔未收 → 真相揭晓/伏笔回收 → 未知→好奇→满足
4. 归属需求：被孤立/被背叛/被误解 → 被接纳/被信任/和解 → 孤独→心疼→暖心
5. 道德需求：两难选择/被迫做坏事 → 找到第三条路/自我救赎 → 纠结→代入→释然
6. 掌控需求：失控/被玩弄/命运被安排 → 反杀/掌控局面/逆天改命 → 无力→焦虑→解气
7. 优越需求：恶人嚣张/好人吃亏 → 恶人遭报/好人逆袭 → 愤怒→爽快
8. 共情需求：痛苦/失去至亲/希望破灭 → 获得慰藉/希望重燃 → 难过→心疼→温暖

【情绪维度 - 让读者"抓心"】
- 压抑端先于释放端：让读者在"难受"里多待一会儿（被冤枉→等两章才洗清）
- 希望假动作：给读者希望，然后立刻拿走（以为找到证人了，结果证人是假的）
- 情绪反差：上一秒笑，下一秒哭（刚告白成功，下一秒收到噩耗）
- 延迟满足：读者想要的爽点延后给（恶人被打脸不是现在，是三十章后）
- 情感对照：用一件事反衬另一件事（女主被怀疑，男二无条件相信）
- 无声的疼：不写哭喊，写细节（把手机扣在桌上、把面碗留在水池里）
- 迟来的好：已经不需要了，对方才给（"对不起"——"没关系，我不需要了"）

【情节维度 - 让读者停不下来】
- 核心冲突：角色想要A，但现实给B（想留在家乡照顾母亲，但offer在外地）
- 层层加码：问题不是一次解决，而是一个接一个（被冤枉→证据被毁→证人失踪）
- 倒计时/时间压力：必须在X时间内完成某事（三天后婚礼、七天后还债）
- 两难选择：选A伤B，选B伤A（救母亲还是救恋人）
- 代价明确：做出选择要付出什么（说出真相会失去爱人、保持沉默会失去自我）
- 意外援军：最没想到的人出手相助（宿敌递来关键证据）
- 功亏一篑：差一点就成功了，然后功亏一篑（找到证据了，但被抢走了）
- 反转：读者以为的"真相"是错的（以为的好人其实是幕后黑手）

【细节维度 - 让世界真实可感】
- 感官细节：看/听/闻/触/尝（消毒水的味道、旧书的霉味）
- 习惯动作：角色紧张/开心时的小动作（紧张时转笔、开心时哼歌）
- 道具象征：某个物品承载情感（一只旧手表、一条围巾、一盆快死的绿萝）
- 环境投射：天气/光线反映角色情绪（下雨天分手、晴空万里时被骗）
- 对话潜台词：嘴上说A，实际意思是B（"你来干什么"——"我想你了"）
- 留白：不写出来的，比写出来的更重（对方正在输入……最后什么都没发）

【角色核心创伤 - 10种类型】
赋予每个角色1-2种核心创伤，决定行为模式和情感按钮：
1. 被抛弃型：不相信自己值得被留下 → 要么过度黏人要么不敢靠近，总在对方离开前先分手
2. 被忽视型：觉得自己的存在不重要 → 习惯性讨好他人，不知道怎么表达需求
3. 被背叛型：认为信任是危险的 → 很难信任任何人，反复测试忠诚
4. 被控制型：觉得自己没有权利做自己 → 要么极度顺从要么极度反叛
5. 被虐待型：深层认为自己"是坏的，活该" → 自我价值感极低，对伤害忍耐度异常高
6. 被孤立型：觉得自己不属于任何地方 → 对社交场合极度焦虑
7. 目睹暴力型：认为世界是危险的，爱与伤害总同时出现 → 不知道健康关系什么样
8. 过早承担型：没有童年，永远在照顾别人 → 不会示弱，不会求助，容易burnout
9. 失去安全型：随时可能出事，不能放松 → 过度警觉，无法放松
10. 身份否定型：真正的自己不配被爱，必须伪装 → 习惯性伪装成别人喜欢的样子

【结构维度 - 让读者一直追】
- 钩子开头：第一句话就让读者想知道"然后呢"
- 章节断点：每段结束在"最想知道下文"的地方
- 节奏变化：紧张的段落和舒缓的段落交替
- 伏笔与回收：前面埋的，后面一定要挖
- 情感节拍：压抑-释放-再压抑-更大释放
- 爽点分布：小爽点每1-2段一次，大爽点每5-10段一次

【输出要求】
第三人称开场，直接进入冲突。文字直白有张力，画面感强。结尾停在关键节点，提供有差异性的选项。

【字数限制 - 严格】
- 每次输出正文严格控制在252字以内（不含打点部分）
- 如果一句话在252字处还没说完，必须把这句话完整说完后再停止
- 剧情打点不计入252字限制，放在正文之后

【剧情打点 - 智能标记】
在生成剧情的同时，请根据剧情内容智能判断并标记关键节点。

1. 【提纲节点】识别剧情中的关键转折点、高潮、悬念设置点：
   - 类型：转折 / 高潮 / 悬念 / 铺垫 / 揭示
   - 重要性：critical(重点剧情，红色) / major(较重要，橙色) / normal(普通，灰色)
   - 一句话总结（15字以内）

2. 【线索节点】识别线索的状态变化点，每条线索是一条独立时间线：
   - 线索名
   - 状态变化：伏笔→展开 / 展开→揭示 / 揭示→闭合 等
   - 一句话描述
   - 重要性

3. 【人物节点】识别新人物出场：
   - 人物ID（唯一标识，如 char_001）
   - 人物名
   - 首次出场位置（章节序号）
   - 人物标签：主角 / 配角 / 反派 / 中立
   - 一句话简述

4. 【关系边】识别已有节点之间的关系变化：
   - 源人物ID
   - 目标人物ID
   - 关系类型：敌对 / 盟友 / 主仆 / 血缘 / 师徒 / 爱慕 / 竞争 等
   - 关系强度（1-5分，随剧情变化可更新）
   - 首次建立关系的场景描述

输出格式（在正文结束后另起一行）：
【剧情打点】
[提纲节点]
转折 | critical | 主角发现密室暗门
悬念 | major | 神秘人留下警告信

[线索节点]
古宅秘宝 | 伏笔→展开 | 地图碎片出现 | major

[人物节点]
char_001 | 李管家 | 1 | 配角 | 古宅管家，知道秘密

[关系边]
char_001 | protagonist | 主仆 | 3 | 主角初入古宅，李管家前来迎接`,
            options: `你是选项设计专家。用户不需要会写，只需要会选。每个选项指向不同的剧情走向。

【选项要求】
1. 差异化：每个选项指向完全不同的剧情走向，不是同一件事的不同说法
2. 简洁：15字以内，一眼看懂
3. 自洽：符合角色性格和当前情境
4. 可持续：每个选项都能展开成完整的下一段叙事，不走进死胡同

【输入变量】
当前剧情：{{storyContext}}
主角信息：{{protagonist}}
相关标签：{{tags}}`
        };

        // Render prompt variables
        function renderPrompt(template, vars) {
            let result = template;
            for (const [key, value] of Object.entries(vars)) {
                result = result.replace(new RegExp(`\\{\\{${key}\\}\\}`, 'g'), value);
            }
            return result;
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function setLoadingState(loading, message = '') {
            isLoading = loading;
            document.getElementById('btnContinue').disabled = loading;
            document.getElementById('storyStatus').textContent = message;
        }

        // Load from localStorage
        function loadStoryData() {
            const saved = localStorage.getItem('current_story_session');
            if (saved) {
                try {
                    currentStory = JSON.parse(saved);
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }

        // Save to localStorage
        function saveStoryData() {
            localStorage.setItem('current_story_session', JSON.stringify(currentStory));
        }

        // Initialize page
        function init() {
            if (!loadStoryData()) {
                alert('没有找到故事数据，请先在首页开始创作');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('worldTitle').textContent = currentStory.worldTitle || '未知世界';
            document.getElementById('characterInfo').textContent = '主角：' + (currentStory.protagonist || '未知');
            document.getElementById('narrativeInfo').textContent = '叙事：' + (currentStory.narrative || '默认');

            const tagsHtml = currentStory.worldTags.map(tag =>
                `<span class="tag">${escapeHTML(tag)}</span>`
            ).join('');
            document.getElementById('worldTags').innerHTML = tagsHtml;

            // Load personality framework data
            protagonistStyle = currentStory.protagonistStyle || '';
            try {
                const fw = localStorage.getItem('personality_framework');
                if (fw) personalityFramework = JSON.parse(fw);
            } catch (e) {}

            // Render protagonist card
            renderChars();

            // Display all history if exists
            if (currentStory.history.length > 0) {
                displayFullStory();
            } else {
                generateOpening();
            }

            saveStoryData();
        }

        // Generate opening
        async function generateOpening() {
            setLoadingState(true, '正在生成开篇...');
            showLoading();

            const config = getApiConfig();
            if (!config.apiKey) {
                showToast('请先在首页设置 API Key');
                window.location.href = 'index.html';
                return;
            }

            const pref = localStorage.getItem('user_preference') || '';

            const prompt = `${pref}
世界背景：${currentStory.worldTitle}
主角：${currentStory.protagonist}
金手指：${currentStory.goldenFinger || '无'}
叙事风格：${currentStory.narrative}

请根据以上设定，创作故事开篇。要求：
1. 第三人称开场，直接进入冲突
2. 首句必须有异常、不安或未解问题
3. 文字直白有张力，画面感强
4. 结尾停在关键节点，提供3个选项`;

            const systemPrompt = renderPrompt(systemPrompts.story, {
                worldTitle: currentStory.worldTitle,
                worldDesc: currentStory.worldDesc || '',
                protagonist: currentStory.protagonist,
                goldenFinger: currentStory.goldenFinger || '无'
            });

            try {
                const result = await callDeepSeek(prompt, systemPrompt, (text) => {
                    displayStoryContent(text);
                });

                if (result) {
                    typewriterReset();
                    const cleanResult = ensureCompleteSentence(result);
                    const displayText = stripStructuredMeta(cleanResult);
                    const segment = {
                        content: displayText,
                        timestamp: Date.now()
                    };
                    currentStory.history.push(segment);
                    displayFullStory();
                    appendNewMeta(cleanResult);
                    saveStoryData();
                    autoSave();
                } else {
                    typewriterReset();
                    document.getElementById('storyText').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">生成失败，请检查 API Key 后刷新重试</p>';
                }
            } catch (error) {
                console.error('生成开篇失败:', error);
                typewriterReset();
                document.getElementById('storyText').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">生成失败，请重试</p>';
            }

            setLoadingState(false);
        }

        // Render text to HTML paragraphs
        function textToHtml(content) {
            return content
                .split('\n')
                .filter(line => line.trim())
                .map(p => {
                    const clean = p.trim();
                    const isChoice = /^[A-E][\.、:：]/.test(clean) || /^选项[一二三四五]/.test(clean);
                    return `<p class="${isChoice ? 'choice-line' : ''}">${escapeHTML(clean)}</p>`;
                })
                .join('');
        }

        // Display full story (all history segments)
        function displayFullStory() {
            const allContent = currentStory.history.map(h => h.content);
            document.getElementById('storyText').innerHTML = allContent.map(c => textToHtml(c)).join('<hr class="story-divider">');
        }

        // Display story content: all previous history + current streaming text
        function displayStoryContent(newText) {
            typewriterFeed(newText);
        }

        // ---- Typewriter engine (character-by-character display) ----
        let _tw = { raf: null, text: '', pos: 0, speed: 1 };

        function typewriterFeed(text) {
            _tw.text = text;
            if (!_tw.raf) _tw.raf = requestAnimationFrame(typewriterTick);
        }

        function typewriterTick() {
            if (_tw.pos >= _tw.text.length) {
                cancelAnimationFrame(_tw.raf);
                _tw.raf = null;
                return;
            }
            // Advance 1-2 chars per frame depending on speed
            _tw.pos = Math.min(_tw.pos + _tw.speed, _tw.text.length);
            const partial = _tw.text.slice(0, _tw.pos);
            const prevHtml = currentStory.history.map(h => textToHtml(h.content)).join('<hr class="story-divider">');
            const newHtml = textToHtml(partial);
            const divider = currentStory.history.length > 0 ? '<hr class="story-divider">' : '';
            document.getElementById('storyText').innerHTML = prevHtml + divider + newHtml;
            const storyEl = document.querySelector('.story-content');
            storyEl.scrollTop = storyEl.scrollHeight;
            _tw.raf = requestAnimationFrame(typewriterTick);
        }

        function typewriterReset() {
            if (_tw.raf) { cancelAnimationFrame(_tw.raf);
                _tw.raf = null; }
            _tw.text = '';
            _tw.pos = 0;
        }

        // Show loading appended below existing content
        function showLoading() {
            const prevHtml = currentStory.history.map(h => textToHtml(h.content)).join('<hr class="story-divider">');
            const divider = currentStory.history.length > 0 ? '<hr class="story-divider">' : '';
            document.getElementById('storyText').innerHTML = prevHtml + divider + `
                <div class="story-loading">
                    <div class="loading-dots"><span></span><span></span><span></span></div>
                    <span>创作中...</span>
                </div>
            `;
            const storyEl = document.querySelector('.story-content');
            storyEl.scrollTop = storyEl.scrollHeight;
        }

        // Continue story
        async function continueStory() {
            if (isLoading) return;

            const customInput = document.getElementById('customInput').value.trim();
            let userChoice = '';

            if (customInput) {
                userChoice = customInput;
            } else {
                userChoice = '继续发展剧情';
            }

            setLoadingState(true, '正在续写...');
            showLoading();

            const config = getApiConfig();
            if (!config.apiKey) {
                showToast('请先在首页设置 API Key');
                setLoadingState(false);
                return;
            }

            const pref = localStorage.getItem('user_preference') || '';
            const storySoFar = currentStory.history.map(h => h.content).join('\n\n');

            const prompt = `${pref}
用户选择：${userChoice}

请继续故事，接续以下内容：
${storySoFar}

要求：
1. 第三人称继续
2. 情节要有推进和转折
3. 文字直白有张力
4. 结尾停在新的关键节点，提供3个选项`;

            const systemPrompt = renderPrompt(systemPrompts.story, {
                worldTitle: currentStory.worldTitle,
                worldDesc: currentStory.worldDesc || '',
                protagonist: currentStory.protagonist,
                goldenFinger: currentStory.goldenFinger || '无'
            });

            try {
                const result = await callDeepSeek(prompt, systemPrompt, (text) => {
                    displayStoryContent(text);
                });

                if (result) {
                    typewriterReset();
                    const cleanResult = ensureCompleteSentence(result);
                    const displayText = stripStructuredMeta(cleanResult);
                    const segment = {
                        content: displayText,
                        timestamp: Date.now()
                    };
                    currentStory.history.push(segment);
                    displayFullStory();
                    document.getElementById('customInput').value = '';
                    document.getElementById('continueHint').textContent = '输入剧情方向，或直接点击继续';
                    appendNewMeta(cleanResult);
                    saveStoryData();
                    autoSave();
                }
            } catch (error) {
                console.error('继续创作失败:', error);
                typewriterReset();
                showToast('继续创作失败，请稍后再试');
            }

            setLoadingState(false);
        }

        // Auto-save: 每次生成新段落后自动保存/更新历史记录
        let autoSaveId = null; // 当前故事在 history 中的 id

        function autoSave() {
            if (currentStory.history.length === 0) return;
            const content = currentStory.history.map(h => h.content).join('\n\n---\n\n');
            let history = JSON.parse(localStorage.getItem('story_history') || '[]');

            // 查找已有的自动保存条目（同一个 autoSaveId）
            const existIdx = autoSaveId ? history.findIndex(h => h._autoId === autoSaveId) : -1;
            const storyData = {
                _autoId: autoSaveId || (autoSaveId = Date.now().toString(36)),
                title: currentStory.worldTitle + ' - 故事',
                date: new Date().toLocaleString('zh-CN'),
                content,
                worldTitle: currentStory.worldTitle,
                protagonist: currentStory.protagonist
            };

            if (existIdx >= 0) {
                history[existIdx] = storyData;
            } else {
                history.unshift(storyData);
            }
            history = history.slice(0, 50);
            localStorage.setItem('story_history', JSON.stringify(history));
        }

        // 手动保存（可改标题）
        function saveStory() {
            const title = prompt('请输入故事标题：', currentStory.worldTitle + ' - 故事');
            if (!title) return;

            const content = currentStory.history.map(h => h.content).join('\n\n---\n\n');
            let history = JSON.parse(localStorage.getItem('story_history') || '[]');

            // 更新已有自动保存条目的标题，或创建新条目
            const existIdx = autoSaveId ? history.findIndex(h => h._autoId === autoSaveId) : -1;
            const storyData = {
                _autoId: autoSaveId || (autoSaveId = Date.now().toString(36)),
                title: title,
                date: new Date().toLocaleString('zh-CN'),
                content,
                worldTitle: currentStory.worldTitle,
                protagonist: currentStory.protagonist
            };

            if (existIdx >= 0) {
                history[existIdx] = storyData;
            } else {
                history.unshift(storyData);
            }
            history = history.slice(0, 50);
            localStorage.setItem('story_history', JSON.stringify(history));

            showToast('已保存到历史记录');
        }

        // Export story
        function exportStory() {
            const content = currentStory.history.map(h => h.content).join('\n\n---\n\n');
            if (!content.trim()) {
                showToast('当前还没有可导出的正文');
                return;
            }
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (currentStory.worldTitle || '故事') + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // API Settings Panel
        function toggleApiPanel() {
            const modal = document.getElementById('apiModal');
            const apiKeyInput = document.getElementById('apiKeyInput');
            if (modal.classList.contains('show')) {
                modal.classList.remove('show');
            } else {
                apiKeyInput.value = localStorage.getItem('deepseek_api_key') || '';
                modal.classList.add('show');
            }
        }

        function saveApiKey() {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showToast('请输入有效的 API Key');
                return;
            }
            localStorage.setItem('deepseek_api_key', apiKey);
            showToast('API Key 已保存');
            toggleApiPanel();
        }

        // Close modal on background click
        document.getElementById('apiModal').addEventListener('click', (e) => {
            if (e.target.id === 'apiModal') {
                toggleApiPanel();
            }
        });

        document.getElementById('customInput').addEventListener('input', () => {
            if (document.getElementById('customInput').value.trim()) {
                document.getElementById('continueHint').textContent = '将按自定义剧情继续';
            } else {
                document.getElementById('continueHint').textContent = '输入剧情方向，或直接点击继续';
            }
        });

        document.getElementById('customInput').addEventListener('keydown', (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                event.preventDefault();
                continueStory();
            }
        });

        // API functions (simplified - would need full implementation)
        async function callDeepSeek(prompt, systemPrompt, onChunk) {
            const config = getApiConfig();
            if (!config.apiKey) return null;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        max_tokens: 252,
                        temperature: 0.8,
                        stream: true
                    })
                });

                if (!response.ok) throw new Error('API error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let result = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content || '';
                                if (content) {
                                    result += content;
                                    if (onChunk) onChunk(result);
                                }
                            } catch (e) {}
                        }
                    }
                }
                return result;
            } catch (error) {
                console.error('DeepSeek API错误:', error);
                return null;
            }
        }

        function getApiConfig() {
            return {
                apiKey: localStorage.getItem('deepseek_api_key') || '',
                model: localStorage.getItem('deepseek_model') || 'deepseek-v4-pro'
            };
        }

        // ==================== Structured Metadata Parsing & Rendering ====================

        // Ensure text ends with a complete sentence (always cut to last period)
        function ensureCompleteSentence(text) {
            const lastPeriod = Math.max(
                text.lastIndexOf('。'),
                text.lastIndexOf('！'),
                text.lastIndexOf('？')
            );
            if (lastPeriod > 0) {
                return text.slice(0, lastPeriod + 1);
            }
            return text;
        }

        // Strip structured metadata from display text
        function stripStructuredMeta(text) {
            const idxPlot = text.indexOf('【剧情打点】');
            const idxOutline = text.indexOf('【提纲节点】');
            const idxClues = text.indexOf('【线索追踪】');
            const idxChars = text.indexOf('【人物卡】');
            const cutAt = [idxPlot, idxOutline, idxClues, idxChars].filter(i => i > 0);
            if (cutAt.length > 0) {
                return text.slice(0, Math.min(...cutAt)).trim();
            }
            return text.trim();
        }

        // Extract section by markers
        function extractSection(text, startMarker, endMarkers) {
            const start = text.indexOf(startMarker);
            if (start === -1) return '';
            let end = text.length;
            for (const em of endMarkers) {
                const idx = text.indexOf(em, start + startMarker.length);
                if (idx > 0 && idx < end) end = idx;
            }
            return text.slice(start + startMarker.length, end);
        }

        // Parse plot points from new 【剧情打点】format
        function parsePlotPoints(fullText) {
            const points = { outline: [], clues: [], characters: [], relations: [] };
            const section = extractSection(fullText, '【剧情打点】', ['【提纲节点】', '【线索追踪】', '【人物卡】']);
            if (!section) return points;

            let currentSub = '';
            section.split('\n').forEach(line => {
                line = line.trim();
                if (!line) return;
                if (line === '[提纲节点]') { currentSub = 'outline'; return; }
                if (line === '[线索节点]') { currentSub = 'clues'; return; }
                if (line === '[人物节点]') { currentSub = 'characters'; return; }
                if (line === '[关系边]') { currentSub = 'relations'; return; }

                const parts = line.split('|').map(s => s.trim());
                if (currentSub === 'outline' && parts.length >= 3) {
                    points.outline.push({
                        type: parts[0],
                        importance: parts[1],
                        summary: parts[2],
                        _new: true
                    });
                } else if (currentSub === 'clues' && parts.length >= 3) {
                    points.clues.push({
                        name: parts[0],
                        stateChange: parts[1],
                        desc: parts[2],
                        importance: parts[3] || 'normal',
                        _new: true
                    });
                } else if (currentSub === 'characters' && parts.length >= 4) {
                    points.characters.push({
                        id: parts[0],
                        name: parts[1],
                        firstAppear: parseInt(parts[2]) || 0,
                        tag: parts[3],
                        desc: parts[4] || '',
                        _new: true
                    });
                } else if (currentSub === 'relations' && parts.length >= 4) {
                    points.relations.push({
                        source: parts[0],
                        target: parts[1],
                        type: parts[2],
                        strength: parseInt(parts[3]) || 1,
                        scene: parts[4] || '',
                        _new: true
                    });
                }
            });
            return points;
        }

        // Fallback: parse old format 【提纲节点】/【线索追踪】/【人物卡】
        function parseStructuredMeta(fullText) {
            const outline = [], clues = [], chars = [];

            const outlineSection = extractSection(fullText, '【提纲节点】', ['【线索追踪】', '【人物卡】']);
            if (outlineSection) {
                const lines = outlineSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/第\s*\d+\s*节点[：:]\s*(.+)/);
                    if (m && m[1].trim()) outline.push(m[1].trim());
                }
            }

            const cluesSection = extractSection(fullText, '【线索追踪】', ['【人物卡】', '【提纲节点】']);
            if (cluesSection) {
                const lines = cluesSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/线索[\w\d]*[：:]\s*([^|]+)\|\s*([^|]+)\|\s*(.+)/);
                    if (m) {
                        clues.push({ name: m[1].trim(), state: m[2].trim(), desc: m[3].trim() });
                    }
                }
            }

            const charsSection = extractSection(fullText, '【人物卡】', ['【提纲节点】', '【线索追踪】']);
            if (charsSection) {
                const lines = charsSection.split('\n');
                for (const line of lines) {
                    const m = line.match(/-\s*角色名[：:]\s*([^|]+)\|\s*身份[：:]\s*([^|]+)\|\s*性格[：:]\s*([^|]+)\|\s*关键行动[：:]\s*(.+)/);
                    if (m) {
                        chars.push({ name: m[1].trim(), identity: m[2].trim(), personality: m[3].trim(), action: m[4].trim() });
                    }
                }
            }

            return { outline, clues, chars };
        }

        function appendNewMeta(result) {
            const plotPoints = parsePlotPoints(result);
            let hasNewData = false;

            if (plotPoints.outline.length > 0) {
                storyOutline.push(...plotPoints.outline);
                renderOutline();
                renderTimeline();
                hasNewData = true;
            }
            if (plotPoints.clues.length > 0) {
                plotPoints.clues.forEach(newClue => {
                    const exist = storyClues.find(c => c.name === newClue.name);
                    if (exist) { exist.stateChange = newClue.stateChange;
                        exist.desc = newClue.desc;
                        exist.importance = newClue.importance; }
                    else { storyClues.push(newClue); }
                });
                renderClues();
                renderTimeline();
                hasNewData = true;
            }
            if (plotPoints.characters.length > 0) {
                plotPoints.characters.forEach(newChar => {
                    const exist = characterCards.find(c => c.id === newChar.id);
                    if (!exist) { characterCards.push({ ...newChar, _new: true }); }
                });
                renderChars();
                renderRelationGraph();
                setTimeout(() => { characterCards.forEach(c => delete c._new); }, 3500);
                hasNewData = true;
            }
            if (plotPoints.relations.length > 0) {
                plotPoints.relations.forEach(newRel => {
                    const exist = characterRelations.find(r => r.source === newRel.source && r.target === newRel.target);
                    if (!exist) { characterRelations.push({ ...newRel, _new: true }); }
                });
                renderRelationGraph();
                setTimeout(() => { characterRelations.forEach(r => delete r._new); }, 3500);
                hasNewData = true;
            }
            if (!hasNewData) {
                const meta = parseStructuredMeta(result);
                if (meta.outline.length > 0) {
                    storyOutline.push(...meta.outline.map(s => ({ type: '节点', importance: 'normal', summary: s, _new: true })));
                    renderOutline();
                    renderTimeline();
                }
                if (meta.clues.length > 0) {
                    meta.clues.forEach(newClue => {
                        const exist = storyClues.find(c => c.name === newClue.name);
                        if (exist) { exist.state = newClue.state;
                            exist.desc = newClue.desc; }
                        else { storyClues.push({ ...newClue, stateChange: '新线索', importance: 'normal', _new: true }); }
                    });
                    renderClues();
                    renderTimeline();
                }
                if (meta.chars.length > 0) {
                    meta.chars.forEach(newChar => {
                        const exist = characterCards.find(c => c.name === newChar.name);
                        if (!exist) { characterCards.push({ ...newChar, new: true }); }
                    });
                    renderChars();
                    renderRelationGraph();
                    setTimeout(() => { characterCards.forEach(c => delete c.new); }, 3500);
                }
            }
        }

        function renderOutline() {
            const list = document.getElementById('outlineList');
            if (!list) return;
            if (storyOutline.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无提纲节点</div>'; return; }
            list.innerHTML = storyOutline.map(n => {
                const imp = n.importance || 'normal';
                return '<div class="ol-item"><span class="ol-dot ' + imp + '"></span><span>' + escapeHTML(n.summary || n.type || '') + '</span></div>';
            }).join('');
        }

        function renderClues() {
            const list = document.getElementById('cluesList');
            if (!list) return;
            if (storyClues.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无线索</div>'; return; }
            list.innerHTML = storyClues.map(c => {
                const s = c.stateChange || c.state || '';
                return '<div class="cl-item"><span class="cl-dot"></span><span><span class="cl-name">' + escapeHTML(c.name) + '</span>' + escapeHTML(c.desc) + '</span><span class="cl-state">' + escapeHTML(s) + '</span></div>';
            }).join('');
        }

        function renderChars() {
            const list = document.getElementById('charsList');
            if (!list) return;
            let html = '';
            if (currentStory.protagonist) {
                html += '<div class="ch-item"><span class="ch-avatar">主</span><span class="ch-name">' + escapeHTML(currentStory.protagonist) + '</span><span class="ch-rel">主角</span></div>';
            }
            characterCards.forEach(c => {
                if (c.tag !== '主角') {
                    const ini = c.name ? c.name[0] : '?';
                    const tagLabel = c.tag || c.relation || '';
                    html += '<div class="ch-item"><span class="ch-avatar">' + escapeHTML(ini) + '</span><span class="ch-name">' + escapeHTML(c.name) + '</span><span class="ch-rel">' + escapeHTML(tagLabel) + '</span></div>';
                }
            });
            list.innerHTML = html || '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;">暂无角色</div>';
        }

        function renderTimeline() {
            const container = document.getElementById('timelineNodes');
            const track = document.getElementById('timelineTrack');
            if (!container || !track) return;

            let nodes = currentSidebarTab === 'outline' ? storyOutline : storyClues;
            if (!nodes.length) { container.innerHTML = ''; return; }

            const h = track.clientHeight;
            const s = h / (nodes.length + 1);
            const cx = 16; // timeline center (32px / 2)

            let svg = '<svg style="position:absolute;top:0;left:0;width:32px;height:' + h + 'px;overflow:visible;">';
            nodes.forEach((n, i) => {
                const y = s * (i + 1);
                if (i > 0) {
                    const py = s * i;
                    svg += '<line x1="' + cx + '" y1="' + py + '" x2="' + cx + '" y2="' + y + '" stroke="#e5e0d8" stroke-width="1" />';
                }
                const imp = n.importance || 'normal';
                const cm = { critical: '#c97a7a', major: '#c9a060', normal: '#b0a99e' };
                svg += '<circle cx="' + cx + '" cy="' + y + '" r="5" fill="' + cm[imp] + '" stroke="#fff" stroke-width="2" />';
            });
            svg += '</svg>';

            const overlays = nodes.map((n, i) => {
                const y = s * (i + 1);
                const title = escapeHTML(n.summary || n.name || n.desc || '');
                return '<div style="position:absolute;left:0;top:' + y + 'px;width:100%;height:16px;transform:translateY(-8px);cursor:pointer;" onmouseenter="showTT(this,\'' + title + '\')" onmouseleave="hideTT()"></div>';
            }).join('');
            container.innerHTML = svg + overlays;
        }

        function renderRelationGraph() {
            const list = document.getElementById('charsList');
            if (!list) return;

            // Build node map by id
            const nodeMap = {};
            if (currentStory.protagonist) {
                nodeMap['protagonist'] = { id: 'protagonist', name: currentStory.protagonist, isP: true };
            }
            characterCards.forEach(c => {
                if (c.id) nodeMap[c.id] = { id: c.id, name: c.name, isP: false, tag: c.tag || '' };
            });

            // Build relation lines
            const relLines = characterRelations.filter(r => nodeMap[r.source] && nodeMap[r.target]);

            let html = '';
            if (Object.keys(nodeMap).length >= 2) {
                const centerX = 24, centerY = 150, radius = 80;
                const nodes = Object.values(nodeMap);
                const n = nodes.length;

                // Position nodes: protagonist in center, others in circle
                const nodePos = {};
                nodes.forEach((node, i) => {
                    if (node.isP) {
                        nodePos[node.id] = { x: centerX, y: centerY };
                    } else {
                        const angle = (2 * Math.PI * (i - 1)) / Math.max(n - 1, 1) - Math.PI / 2;
                        nodePos[node.id] = {
                            x: centerX + radius * Math.cos(angle),
                            y: centerY + radius * Math.sin(angle)
                        };
                    }
                });

                let svg = '<svg width="200" height="300" style="overflow:visible;">';
                // Draw relation lines first (behind nodes)
                relLines.forEach(r => {
                    const s = nodePos[r.source];
                    const t = nodePos[r.target];
                    if (s && t) {
                        const strength = r.strength || 1;
                        svg += '<line x1="' + s.x + '" y1="' + s.y + '" x2="' + t.x + '" y2="' + t.y + '" stroke="#d9d2c4" stroke-width="' + strength + '" />';
                    }
                });
                // Draw nodes
                nodes.forEach(node => {
                    const pos = nodePos[node.id];
                    const rr = node.isP ? 8 : 5;
                    const fill = node.isP ? '#c4971e' : '#8e867d';
                    svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + rr + '" fill="' + fill + '" stroke="#fff" stroke-width="1.5" />';
                    svg += '<text x="' + (pos.x + (node.isP ? 12 : 8)) + '" y="' + (pos.y + 4) + '" font-size="10" fill="#5c554c" font-family="inherit">' + escapeHTML(node.name) + '</text>';
                });
                svg += '</svg>';
                html += '<div class="ch-graph">' + svg + '</div>';
            } else if (Object.keys(nodeMap).length === 1) {
                const node = Object.values(nodeMap)[0];
                html += '<div class="ch-graph"><svg width="200" height="40"><circle cx="20" cy="20" r="7" fill="#c4971e" stroke="#fff" stroke-width="2"/><text x="34" y="24" font-size="10" fill="#5c554c" font-family="inherit">' + escapeHTML(node.name) + '</text></svg></div>';
            }

            // Append or replace graph in charsList
            const exist = document.querySelector('.ch-graph');
            if (exist) exist.remove();
            if (html) list.insertAdjacentHTML('beforeend', html);
        }

        function showTT(el, text) {
            let tt = document.getElementById('nodeTooltip');
            if (!tt) { tt = document.createElement('div');
                tt.id = 'nodeTooltip';
                tt.style.cssText = 'position:fixed;background:#fff;border:1px solid #e0d9cf;border-radius:8px;padding:8px 12px;font-size:0.75rem;color:#5c554c;z-index:200;max-width:180px;pointer-events:none;opacity:0;transition:opacity 0.2s;';
                document.body.appendChild(tt); }
            tt.textContent = text;
            const r = el.getBoundingClientRect();
            tt.style.left = (r.left - 190) + 'px';
            tt.style.top = (r.top + r.height / 2 - 16) + 'px';
            tt.style.opacity = '1';
        }
        function hideTT() { const tt = document.getElementById('nodeTooltip'); if (tt) tt.style.opacity = '0'; }

        function switchTab(tab) {
            currentSidebarTab = tab;
            document.querySelectorAll('.s-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.querySelectorAll('.sb-pane').forEach(p => p.classList.toggle('active', p.id === 'sb' + tab.charAt(0).toUpperCase() + tab.slice(1)));
            if (tab === 'characters') { renderChars();
                renderRelationGraph(); }
            else { renderTimeline(); }
        }

        // ==================== End Structured Metadata ====================

        // Init
        init();
    </script>
