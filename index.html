<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即墨 · 创作入口</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300..900&family=Noto+Sans+SC:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 宣纸底色系 */
      --paper-new: oklch(98% 0.006 95);
      --paper-aged: oklch(96% 0.010 92);
      --paper-dark: oklch(92% 0.014 88);
      /* 墨分五色 */
      --ink-light: oklch(65% 0.018 85);
      --ink-mid: oklch(40% 0.024 80);
      --ink-heavy: oklch(20% 0.030 70);
      --ink-black: oklch(15% 0.032 60);
      /* 朱砂唯一点缀 */
      --seal: oklch(48% 0.16 28);
      --seal-dark: oklch(38% 0.18 22);
      /* 边框 */
      --border: oklch(82% 0.008 90);
      --border-dark: oklch(60% 0.012 82);

      --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;

      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 48px;
      --space-xl: 80px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-full: 9999px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --shadow-soft: 0 2px 12px oklch(20% 0.030 70 / 0.07), 0 4px 20px oklch(20% 0.030 70 / 0.05);
      --shadow-medium: 0 4px 16px oklch(20% 0.030 70 / 0.10), 0 8px 30px oklch(20% 0.030 70 / 0.08);
      --shadow-strong: 0 8px 24px oklch(20% 0.030 70 / 0.14), 0 14px 40px oklch(20% 0.030 70 / 0.10);
      --topbar-bg: #2c2825;
      --topbar-text: #e8e2d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--paper-new);
      color: var(--ink-light);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--topbar-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
    }
    .top-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--topbar-text);
      letter-spacing: 0.05em;
    }
    .top-right {
      display: flex;
      gap: 10px;
    }
    .top-btn {
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all var(--transition-normal);
      background: rgba(255,255,255,0.10);
      color: var(--topbar-text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn:hover {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border-color: rgba(255,255,255,0.38);
    }
    .top-btn:active { transform: scale(0.95); }

    /* ===== MAIN LAYOUT ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 40px;
      max-width: 660px;
      margin: 0 auto;
      width: 100%;
    }

    /* ===== TAB BAR ===== */
    /* ===== TAB BOTTOM NAV ===== */
    .tab-nav-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-md);
      padding-top: var(--space-sm);
      border-top: 1px solid var(--border);
    }
    .btn-nav {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--paper-new);
      color: var(--ink-mid);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-nav:hover {
      border-color: var(--seal);
      color: var(--seal);
    }

    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 0 20px;
      background: var(--paper-aged);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 14px 32px;
      border: none;
      background: transparent;
      color: var(--ink-mid);
      font-family: var(--font-display);
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
      position: relative;
      bottom: -1px;
    }
    .tab-btn:hover { color: var(--ink-heavy); }
    .tab-btn.active {
      color: var(--seal);
      border-bottom-color: var(--seal);
    }
    .tab-panel {
      display: none;
      width: 100%;
    }
    .tab-panel.active {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .tab-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-label {
      font-size: 0.78rem;
      color: var(--ink-mid);
      font-weight: 600;
      letter-spacing: 1px;
    }
    .tab-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: var(--paper-dark);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      color: var(--ink-mid);
    }
    .tag.active {
      background: oklch(48% 0.16 28 / 0.12);
      border-color: var(--seal);
      color: var(--seal-dark);
    }
    .tag-empty {
      color: var(--ink-mid);
      font-size: 0.82rem;
      font-style: italic;
    }

    .generated-info {
      margin-top: var(--space-sm);
      padding: var(--space-sm);
      background: oklch(48% 0.16 28 / 0.08);
      border: 1px solid oklch(48% 0.16 28 / 0.20);
      border-radius: var(--radius-md);
      min-height: 48px;
    }
    .generated-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--ink-heavy);
      margin-bottom: 4px;
    }
    .generated-desc {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .generated-info.streaming::after {
      content: '█';
      animation: blink 0.6s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    /* ===== BUTTONS ===== */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-custom {
      background: transparent;
      color: var(--ink-mid);
      border: 1.5px solid var(--border-dark);
    }
    .btn-custom:hover {
      border-color: var(--ink-heavy);
      color: var(--ink-heavy);
    }
    .btn-random {
      background: transparent;
      color: var(--seal);
      border: 1.5px dashed var(--seal);
      border-radius: var(--radius-full);
      padding: 10px 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all var(--transition-fast);
    }
    .btn-random:hover {
      background: oklch(48% 0.16 28 / 0.10);
    }
    .btn-generate {
      background: var(--ink-heavy);
      color: var(--paper-new);
      box-shadow: 0 3px 12px oklch(20% 0.030 70 / 0.3);
    }
    .btn-generate:hover {
      background: var(--ink-black);
      transform: translateY(-2px);
      box-shadow: 0 5px 16px oklch(20% 0.030 70 / 0.38);
    }
    .btn-generate:active { transform: translateY(0) scale(0.97); }
    .btn-generate:disabled {
      background: var(--border-dark);
      cursor: not-allowed;
      transform: none;
    }

    .btn-start {
      padding: 14px 48px;
      font-size: 1rem;
      background: var(--ink-heavy);
      color: var(--paper-new);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 4px 18px oklch(20% 0.030 70 / 0.38);
      transition: all var(--transition-normal);
    }
    .btn-start:hover {
      background: var(--ink-black);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px oklch(20% 0.030 70 / 0.45);
    }
    .btn-start:active { transform: translateY(0) scale(0.97); }

    /* ===== TAG SELECTION PANEL (Modal/Slide) ===== */
    .tag-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tag-panel-overlay.open {
      display: flex;
    }
    .tag-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 680px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }
    .tag-panel-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .tag-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--ink-heavy);
    }
    .tag-panel-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--paper-aged);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .tag-panel-close:hover { background: var(--paper-dark); }
    .tag-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-md) var(--space-lg);
    }
    .tag-panel-footer {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
      flex-shrink: 0;
    }

    .tag-dim {
      margin-bottom: var(--space-md);
    }
    .tag-dim:last-child { margin-bottom: 0; }
    .tag-dim-label {
      font-size: 0.78rem;
      color: var(--ink-mid);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-option {
      padding: 6px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--paper-new);
      color: var(--ink-mid);
    }
    .tag-option:hover {
      border-color: var(--seal);
      color: var(--seal-dark);
    }
    .tag-option.selected {
      background: oklch(48% 0.16 28 / 0.10);
      border-color: var(--seal);
      color: var(--seal-dark);
      font-weight: 600;
    }
    .tag-option input { display: none; }

    .tag-style-choice {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      padding: var(--space-lg) 0;
    }
    .tag-style-btn {
      padding: 16px 32px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.1rem;
      background: var(--paper-new);
      color: var(--ink-heavy);
      transition: all var(--transition-normal);
    }
    .tag-style-btn:hover {
      border-color: var(--seal);
      background: oklch(48% 0.16 28 / 0.08);
    }

    .btn-reset {
      background: transparent;
      border: 1.5px solid var(--border-dark);
      color: var(--ink-mid);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all var(--transition-fast);
    }
    .btn-reset:hover { border-color: var(--ink-heavy); color: var(--ink-heavy); }
    .btn-confirm {
      background: var(--ink-heavy);
      border: none;
      color: var(--paper-new);
      padding: 8px 20px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all var(--transition-fast);
    }
    .btn-confirm:hover { background: var(--ink-black); }

    /* ===== API PANEL ===== */
    .api-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .api-panel-overlay.open { display: flex; }
    .api-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: var(--space-lg);
      box-shadow: var(--shadow-strong);
    }
    .api-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: var(--space-md);
      color: var(--ink-heavy);
    }
    .api-input-wrap {
      position: relative;
    }
    .api-input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--paper-new);
      color: var(--ink-heavy);
      transition: all var(--transition-fast);
    }
    .api-input:focus {
      outline: none;
      border-color: var(--seal);
      box-shadow: 0 0 0 3px oklch(48% 0.16 28 / 0.15);
    }
    .api-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-mid);
      font-size: 0.85rem;
      padding: 4px;
    }
    .api-toggle:hover { color: var(--ink-heavy); }
    .api-save-btn {
      width: 100%;
      margin-top: var(--space-md);
      padding: 12px;
      background: var(--ink-heavy);
      color: var(--paper-new);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .api-save-btn:hover { background: var(--ink-black); }
    .api-test-btn {
      width: 100%;
      margin-top: var(--space-sm);
      padding: 10px;
      background: transparent;
      color: var(--ink-mid);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: all var(--transition-fast);
    }
    .api-test-btn:hover { border-color: var(--seal); color: var(--seal-dark); }
    .api-test-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .api-test-btn.testing { color: var(--seal); }

    /* ===== HISTORY PANEL ===== */
    .history-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .history-panel-overlay.open { display: flex; }
    .history-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }
    .history-panel-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .history-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--ink-heavy);
    }
    .history-panel-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--paper-aged);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .history-panel-close:hover { background: var(--paper-dark); }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-sm);
    }
    .history-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-mid);
      font-size: 0.88rem;
    }
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }
    .history-item:hover {
      background: var(--paper-aged);
      border-color: var(--border);
    }
    .history-item-left { flex: 1; min-width: 0; }
    .history-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-heavy);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item-meta {
      font-size: 0.75rem;
      color: var(--ink-mid);
    }
    .history-item-delete {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-mid);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .history-item-delete:hover {
      background: oklch(48% 0.16 28 / 0.12);
      color: var(--seal-dark);
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translate(-50%, 16px);
      padding: 10px 20px;
      background: oklch(20% 0.030 70 / 0.92);
      color: #fff;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-strong);
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal), transform var(--transition-normal);
      z-index: 300;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-mid); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .main { padding: 24px 16px 120px; }
      .card { padding: var(--space-md); }
      .tag-panel { max-height: 90vh; }
      .history-panel { max-height: 90vh; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-title">即墨</div>
  <div class="top-right">
    <button class="top-btn" onclick="oneClickGenerate()" style="background: var(--seal); border-color: var(--seal);">一键生成</button>
    <button class="top-btn" onclick="openPref()">偏好</button>
    <button class="top-btn" onclick="openHistory()">历史记录</button>
    <button class="top-btn" onclick="openApi()">API设置</button>
    <a href="admin.html" class="top-btn">提示词管理</a>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="world" onclick="switchMainTab('world')">世界观</button>
  <button class="tab-btn" data-tab="protagonist" onclick="switchMainTab('protagonist')">主角</button>
  <button class="tab-btn" data-tab="narrative" onclick="switchMainTab('narrative')">写作视角</button>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <!-- TAB 1: 世界观 -->
  <div class="tab-panel active" id="tabWorld">
    <div class="tab-section">
      <div class="section-label">选择世界标签</div>
      <div class="tab-tags" id="worldTagsDisplay">
        <span class="tag-empty">点击下方按钮选择世界背景标签</span>
      </div>
      <button class="btn btn-custom" onclick="openTagPanel('world')">选择标签</button>
      <button class="btn btn-random" onclick="randomTags('world')">随机</button>
    </div>
    <div class="tab-section">
      <button class="btn btn-generate" onclick="generateWorld()">生成世界观</button>
    </div>
    <div class="generated-info" id="worldGeneratedInfo"></div>
    <div class="tab-nav-bottom">
      <span></span>
      <button class="btn btn-nav" onclick="switchMainTab('protagonist')">主角设定 →</button>
    </div>
  </div>

  <!-- TAB 2: 主角 -->
  <div class="tab-panel" id="tabProtagonist">
    <div class="tab-section">
      <div class="section-label">主角性格标签</div>
      <div class="tab-tags" id="protagonistTagsDisplay">

【关系维度 - 完整】

function loadPrompts() {
  const saved = localStorage.getItem('prompt_config');
  if (saved) {
    try {
      return JSON.parse(saved);
    } catch (e) {
      console.error('Failed to parse prompt_config:', e);
    }
  }
  return null;
}

function getPrompt(key) {
  const saved = loadPrompts();
  let prompt;
  if (saved && saved[key]) {
    prompt = saved[key];
  } else {
    prompt = defaultPrompts[key] || '';
  }
  // 硬编码写作系统始终注入
  return WRITING_SYSTEM + '\n\n---\n\n' + prompt;
}

// ==================== ARCHIVE UTILITIES ====================
const ARCHIVE_KEYS = {
  worlds: 'jimo_worlds',
  protagonists: 'jimo_protagonists'
};

function loadArchive(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error(`Failed to load archive ${key}:`, e);
    return [];
  }
}

function saveArchive(key, list) {
  try {
    localStorage.setItem(key, JSON.stringify(list));
  } catch (e) {
    console.error(`Failed to save archive ${key}:`, e);
    showToast('保存失败，可能本地存储已满');
  }
}

function nextArchiveId(prefix, list) {
  const max = list.reduce((m, item) => {
    const num = parseInt(item.id?.slice(1), 10) || 0;
    return Math.max(m, num);
  }, 0);
  return `${prefix}${String(max + 1).padStart(3, '0')}`;
}

function addWorldRecord(item) {
  const list = loadArchive(ARCHIVE_KEYS.worlds);
  const record = {
    id: nextArchiveId('W', list),
    createdAt: Date.now(),
    tags: item.tags || [],
    title: item.title || '未命名世界',
    content: item.content || '',
    prompt: item.prompt || ''
  };
  list.unshift(record);
  saveArchive(ARCHIVE_KEYS.worlds, list.slice(0, 200));
  return record;
}

function addProtagonistRecord(item) {
  const list = loadArchive(ARCHIVE_KEYS.protagonists);
  const record = {
    id: nextArchiveId('P', list),
    createdAt: Date.now(),
    tags: item.tags || [],
    title: item.title || '未命名主角',
    content: item.content || '',
    prompt: item.prompt || '',
    worldId: item.worldId || null
  };
  list.unshift(record);
  saveArchive(ARCHIVE_KEYS.protagonists, list.slice(0, 200));
  return record;
}

function findWorldByTitle(title) {
  const worlds = loadArchive(ARCHIVE_KEYS.worlds);
  return worlds.find(w => w.title === title) || null;
}

function findProtagonistByTitle(title) {
  const protagonists = loadArchive(ARCHIVE_KEYS.protagonists);
  return protagonists.find(p => p.title === title) || null;
}

function exportAllHistory() {
  const payload = {
    version: 1,
    exportedAt: Date.now(),
    worlds: loadArchive(ARCHIVE_KEYS.worlds),
    protagonists: loadArchive(ARCHIVE_KEYS.protagonists),
    stories: JSON.parse(localStorage.getItem('story_history') || '[]')
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ts = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
  a.href = url;
  a.download = `jimo-history-${ts}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importAllHistory(file) {
  const text = await file.text();
  let payload;
  try {
    payload = JSON.parse(text);
  } catch (e) {
    showToast('文件格式错误，无法解析');
    return;
  }
  if (!payload || payload.version !== 1) {
    showToast('不兼容的历史记录版本');
    return;
  }

  const merge = (key, incoming) => {
    if (!Array.isArray(incoming)) return;
    const existing = loadArchive(key);
    const existingIds = new Set(existing.map(i => i.id));
    let added = 0;
    for (const item of incoming) {
      if (item.id && !existingIds.has(item.id)) {
        existing.push(item);
        existingIds.add(item.id);
        added++;
      }
    }
    saveArchive(key, existing);
    return added;
  };

  const worldsAdded = merge(ARCHIVE_KEYS.worlds, payload.worlds);
  const protsAdded = merge(ARCHIVE_KEYS.protagonists, payload.protagonists);

  // Merge stories into story_history
  let storiesAdded = 0;
  if (Array.isArray(payload.stories)) {
    const existing = JSON.parse(localStorage.getItem('story_history') || '[]');
    const existingIds = new Set(existing.map(i => i._autoId || i.id));
    for (const item of payload.stories) {
      const key = item._autoId || item.id;
      if (key && !existingIds.has(key)) {
        existing.push(item);
        existingIds.add(key);
        storiesAdded++;
      }
    }
    localStorage.setItem('story_history', JSON.stringify(existing));
  }

  showToast(`导入完成：世界观 +${worldsAdded || 0}，主角 +${protsAdded || 0}，故事 +${storiesAdded || 0}`);
}

// ==================== TAG PANEL ====================
function openTagPanel(type) {
  currentPanel = type;
  const overlay = document.getElementById('tagPanelOverlay');
  const body = document.getElementById('tagPanelBody');
  const title = document.getElementById('tagPanelTitle');

  const titles = { world: '世界背景', protagonist: '主角设定', narrative: '叙事风格' };
  title.textContent = titles[type];

  // Protagonist: show style choice first if not selected
  if (type === 'protagonist' && !state.protagonist.style) {
    body.innerHTML = buildStyleChoiceHTML('protagonist');
    overlay.classList.add('open');
    return;
  }

  body.innerHTML = buildTagPanelHTML(type);

  // Pre-select current tags
  const s = state[type].selected;
  for (const [dim, tag] of Object.entries(s)) {
    const radio = body.querySelector(`input[name="${dim}"][value="${tag}"]`);
    if (radio) radio.checked = true;
  }

  overlay.classList.add('open');
}

function closeTagPanel() {
  document.getElementById('tagPanelOverlay').classList.remove('open');
  currentPanel = null;
}

function buildStyleChoiceHTML(type) {
  if (type === 'protagonist') {
    return `<div class="tag-style-choice">
      <button class="tag-style-btn" onclick="selectProtagonistStyle('chinese')">中式主角</button>
      <button class="tag-style-btn" onclick="selectProtagonistStyle('western')">西式主角</button>
    </div>`;
  }
  return '';
}

function selectProtagonistStyle(style) {
  state.protagonist.style = style;
  // Reset selected tags when switching style
  state.protagonist.selected = {};
  const body = document.getElementById('tagPanelBody');
  body.innerHTML = buildTagPanelHTML('protagonist');
}

function buildTagPanelHTML(type) {
  let dims;
  if (type === 'world') {
    dims = worldDims;
  } else if (type === 'protagonist') {
    dims = state.protagonist.style === 'western' ? protagonistWesternDims : protagonistChineseDims;
  } else {
    // narrative: single-select across all dims
    return buildNarrativePanelHTML();
  }

  let html = '';
  for (const [dim, tags] of Object.entries(dims)) {
    html += `<div class="tag-dim">
      <div class="tag-dim-label">${dim}</div>
      <div class="tag-options">`;
    for (const tag of tags) {
      html += `<label class="tag-option">
        <input type="radio" name="${dim}" value="${tag}" onchange="onTagRadioChange(this)">
        ${tag}
      </label>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function buildNarrativePanelHTML() {
  // narrative: single tag selection across all 5 dims
  const dims = narrativeDims;
  const selected = Object.values(state.narrative.selected)[0] || '';

  let html = `<div class="tag-dim">
    <div class="tag-dim-label">叙事风格（单选）</div>
    <div class="tag-options">`;
  for (const [, tags] of Object.entries(dims)) {
    for (const tag of tags) {
      const isSelected = selected === tag ? ' selected' : '';
      const isChecked = selected === tag ? ' checked' : '';
      html += `<label class="tag-option${isSelected}">
        <input type="radio" name="narrative" value="${tag}"${isChecked} onchange="onNarrativeRadioChange(this)">
        ${tag}
      </label>`;
    }
  }
  html += `</div></div>`;
  return html;
}

function onNarrativeRadioChange(radio) {
  // Single select: uncheck all others
  document.querySelectorAll('input[name="narrative"]').forEach(opt => {
    opt.checked = (opt === radio);
    opt.closest('.tag-option').classList.toggle('selected', opt === radio);
  });
}

function onTagRadioChange(radio) {
  const name = radio.name;
  const options = document.querySelectorAll(`input[name="${name}"]`);
  options.forEach(opt => {
    opt.closest('.tag-option').classList.toggle('selected', opt.checked);
  });
}

function resetTags() {
  if (currentPanel === 'protagonist') {
    state.protagonist.selected = {};
  } else if (currentPanel === 'narrative') {
    state.narrative.selected = {};
  } else {
    state[currentPanel].selected = {};
  }
  document.querySelectorAll('#tagPanelBody input[type="radio"]').forEach(r => {
    r.checked = false;
    r.closest('.tag-option').classList.remove('selected');
  });
}

function confirmTags() {
  if (currentPanel === 'narrative') {
    // narrative: single tag
    const checked = document.querySelector('#tagPanelBody input[name="narrative"]:checked');
    if (checked) {
      state.narrative.selected = { '叙事风格': checked.value };
    }
    renderCard('narrative');
    closeTagPanel();
    return;
  }

  const s = state[currentPanel].selected;
  // Collect checked radios by name
  const checked = document.querySelectorAll('#tagPanelBody input[type="radio"]:checked');
  checked.forEach(radio => {
    s[radio.name] = radio.value;
  });
  renderCard(currentPanel);
  closeTagPanel();
}

function switchMainTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1)));
  currentMainTab = tab;
}

function randomTags(type) {
  if (type === 'world') {
    const dims = Object.keys(worldDims);
    // Pick 3 random dimensions, then 1 random tag from each
    const shuffled = dims.sort(() => Math.random() - 0.5).slice(0, 3);
    const selected = {};
    shuffled.forEach(dim => {
      const tags = worldDims[dim];
      selected[dim] = tags[Math.floor(Math.random() * tags.length)];
    });
    state.world.selected = selected;
    renderCard('world');
  } else if (type === 'protagonist') {
    const styles = ['chinese', 'western'];
    state.protagonist.style = styles[Math.floor(Math.random() * styles.length)];
    const dims = state.protagonist.style === 'chinese' ? protagonistChineseDims : protagonistWesternDims;
    const selected = {};
    for (const [dim, tags] of Object.entries(dims)) {
      selected[dim] = tags[Math.floor(Math.random() * tags.length)];
    }
    state.protagonist.selected = selected;
    renderCard('protagonist');
    // Show which style was picked
    const styleLabel = state.protagonist.style === 'chinese' ? '中式' : '西式';
    showToast('随机：' + styleLabel + '主角');
  } else if (type === 'narrative') {
    const allTags = Object.values(narrativeDims).flat();
    const pick = allTags[Math.floor(Math.random() * allTags.length)];
    state.narrative.selected = { '叙事风格': pick };
    renderCard('narrative');
  }
}

function renderCard(type) {
  const s = state[type].selected;
  const entries = Object.entries(s);
  let containerId;
  if (type === 'world') containerId = 'worldTagsDisplay';
  else if (type === 'protagonist') containerId = 'protagonistTagsDisplay';
  else containerId = 'narrativeTagsDisplay';

  const container = document.getElementById(containerId);
  if (entries.length === 0) {
    const placeholders = {
      world: '选择世界背景标签',
      protagonist: '选择主角性格维度',
      narrative: '选择写作视角'
    };
    container.innerHTML = `<span class="tag-empty">${placeholders[type]}</span>`;
  } else {
    let html = '';
    if (type === 'protagonist' && state.protagonist.style) {
      const styleLabel = state.protagonist.style === 'chinese' ? '中式' : '西式';
      html = `<span class="tag active" style="background: var(--seal); color: var(--paper-new); border-color: var(--seal);">${styleLabel}</span>`;
    }
    html += entries.map(([dim, tag]) =>
      `<span class="tag active" title="${dim}">${tag}</span>`
    ).join('');
    container.innerHTML = html;
  }
}

function renderHistoryList() {
  const list = document.getElementById('historyList');
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { history = []; }

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无历史记录</div>';
    return;
  }

  list.innerHTML = history.map((item, idx) => `
    <div class="history-item" onclick="loadHistory(${idx})">
      <div class="history-item-left">
        <div class="history-item-title">${escapeHTML(item.title || '无标题')}</div>
        <div class="history-item-meta">${item.date || ''} · ${item.content ? item.content.length : 0}字</div>
      </div>
      <button class="history-item-delete" onclick="event.stopPropagation(); deleteHistory(${idx})">&#x2715;</button>
    </div>
  `).join('');
}

function loadHistory(idx) {
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { return; }
  const item = history[idx];
  if (!item) return;

  // Write to current_story_session and navigate
  const session = {
    worldTitle: item.worldTitle || '未知世界',
    worldTags: item.worldTags || [],
    protagonist: item.protagonist || '未知主角',
    protagonistTags: item.protagonistTags || [],
    goldenFinger: item.goldenFinger || '',
    narrative: item.narrative || '',
    history: [],
    storyOutline: item.storyOutline || [],
    storyClues: item.storyClues || [],
    characterCards: item.characterCards || [],
    characterRelations: item.characterRelations || [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  // Try to reconstruct history content
  if (item.content) {
    session.history = [{ content: item.content, options: [] }];
  }

  localStorage.setItem('current_story_session', JSON.stringify(session));
  window.location.href = 'story.html';
}

function deleteHistory(idx) {
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { return; }
  history.splice(idx, 1);
  localStorage.setItem('story_history', JSON.stringify(history));
  renderHistoryList();
  showToast('已删除');
}

function startCreating() {
  const w = state.world.selected;
  const p = state.protagonist.selected;
  const n = state.narrative.selected;
  const style = state.protagonist.style;

  if (Object.keys(w).length === 0) {
    showToast('请先配置世界背景');
    return;
  }
  if (!style) {
    showToast('请先配置主角设定（选择风格）');
    return;
  }
  const requiredTags = style === 'chinese' ? 7 : 6;
  if (Object.keys(p).length < requiredTags) {
    showToast(`请先完整配置主角设定（${requiredTags}个维度）`);
    return;
  }
  if (Object.keys(n).length === 0) {
    showToast('请先选择叙事风格');
    return;
  }

  // Collect tags
  const worldTags = Object.entries(w).map(([, t]) => t);
  const protagonistTags = Object.entries(p).map(([, t]) => t);
  const narrativeTag = Object.values(n)[0];

  const session = {
    worldTitle: state.world.generatedTitle || Object.values(w)[0] || '未知世界',
    worldDesc: state.world.generatedDesc || worldTags.join(' / '),
    worldTags,
    protagonist: state.protagonist.generatedName || '待生成主角',
    protagonistDesc: state.protagonist.generatedDesc || '',
    protagonistTags,
    protagonistStyle: style,
    goldenFinger: '',
    narrative: narrativeTag,
    narrativeDetail: n,
    history: [],
    storyOutline: [],
    storyClues: [],
    characterCards: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  localStorage.setItem('current_story_session', JSON.stringify(session));
  window.location.href = 'story.html';
}

// ==================== API ====================
function getApiConfig() {
  let model = localStorage.getItem('deepseek_model') || 'deepseek-v4-flash';
  // Normalize model name
  if (model === 'flash') model = 'deepseek-v4-flash';
  else if (model === 'pro') model = 'deepseek-v4-pro';
  else if (!model.startsWith('deepseek-')) model = 'deepseek-v4-flash';
  return {
    apiKey: localStorage.getItem('deepseek_api_key') || '',
    model
  };
}

async function callDeepSeek(prompt, systemPrompt, onChunk) {
  const config = getApiConfig();
  if (!config.apiKey) return null;

  try {
    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify({
        model: config.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: prompt }
        ],
        temperature: 0.8,
        stream: true
      })
    });

    if (!response.ok) {
      let errMsg = `HTTP ${response.status}`;
      try {
        const errData = await response.json();
        errMsg = errData.error?.message || errData.error?.type || errMsg;
      } catch {}
      throw new Error(errMsg);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let result = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const content = parsed.choices?.[0]?.delta?.content || '';
            if (content) {
              result += content;
              if (onChunk) onChunk(result);
            }
          } catch (e) {}
        }
      }
    }
    return result;
  } catch (error) {
    console.error('DeepSeek API错误:', error);
    return null;
  }
}

// ---- Typewriter engine (character-by-character display) ----
let _tw = { raf: null, text: '', pos: 0, speed: 1, el: null };

function typewriterFeed(text, el) {
    _tw.text = text;
    _tw.el = el;
    if (!_tw.raf) _tw.raf = requestAnimationFrame(typewriterTick);
}

function typewriterTick() {
    if (_tw.pos >= _tw.text.length) {
        cancelAnimationFrame(_tw.raf);
        _tw.raf = null;
        return;
    }
    _tw.pos = Math.min(_tw.pos + _tw.speed, _tw.text.length);
    if (_tw.el) _tw.el.textContent = _tw.text.slice(0, _tw.pos);
    _tw.raf = requestAnimationFrame(typewriterTick);
}

function typewriterReset() {
    if (_tw.raf) { cancelAnimationFrame(_tw.raf);
        _tw.raf = null; }
    _tw.text = '';
    _tw.pos = 0;
    _tw.el = null;
}

// ==================== GENERATE PROTAGONIST ====================
let isGeneratingProtagonist = false;

function generateProtagonist() {
  const style = state.protagonist.style;
  const s = state.protagonist.selected;

  if (!style) {
    showToast('请先选择主角风格（中式/西式）');
    return;
  }

  const required = style === 'chinese' ? 7 : 6;
  if (Object.keys(s).length < required) {
    showToast(`请先完整配置主角设定（${required}个维度）`);
    return;
  }

  if (isGeneratingProtagonist) return;
  isGeneratingProtagonist = true;

  const tags = Object.entries(s).map(([k, v]) => `${k}:${v}`).join('、');
  const styleLabel = style === 'chinese' ? '中式' : '西式';
  const worldContext = state.world.generatedTitle
    ? `世界名称：${state.world.generatedTitle}\n世界观：${state.world.generatedDesc || ''}`
    : '';

  const pref = getPrefPrompt();
  const prompt = `${pref}根据以下设定，生成一个${styleLabel}主角。背靠这个世界，立体地塑造这个人。

${worldContext}
性格标签：${tags}

请直接输出，格式如下（不要有任何其他内容）：
名字：[名字]
身份：[在这个世界里的位置和处境]
内在驱动：[核心创伤如何驱动TA的行为]
简介：[80字以内，有画面感的立体描述]

名字：`;


  const infoEl = document.getElementById('protagonistGeneratedInfo');
  infoEl.classList.add('streaming');
  infoEl.innerHTML = '<div class="generated-name">生成中...</div><div class="generated-desc" id="protoTypewriter" style="font-family:monospace;font-size:0.82rem;"></div>';
  const twEl = document.getElementById('protoTypewriter');

  callDeepSeek(prompt, getPrompt('protagonistPrompt'), (text) => {
    typewriterFeed(text, twEl);
  }).then(result => {
    typewriterReset();
    if (result) {
      const nameMatch = result.match(/名字[：:]\s*(.+)/);
      if (nameMatch) {
        const name = nameMatch[1].trim();
        const roleMatch = result.match(/身份[：:]\s*(.+)/);
        const driveMatch = result.match(/内在驱动[：:]\s*(.+)/);
        const descMatch = result.match(/简介[：:]\s*(.+)/);
        const desc = [roleMatch, driveMatch, descMatch]
          .filter(m => m).map(m => m[1].trim()).join(' / ');
        state.protagonist.generatedName = name;
        state.protagonist.generatedDesc = desc || (descMatch ? descMatch[1].trim() : '');
        infoEl.classList.remove('streaming');
        infoEl.innerHTML = `<div class="generated-name">${escapeHTML(name)}</div><div class="generated-desc">${escapeHTML(state.protagonist.generatedDesc)}</div>`;

        const protagonistRecord = addProtagonistRecord({
          tags: Object.values(s),
          title: state.protagonist.generatedName,
          content: state.protagonist.generatedDesc,
          prompt: prompt,
          worldId: state.world.savedId || null
        });
        state.protagonist.savedId = protagonistRecord.id;

        showToast('主角已生成');
      } else {
        showToast('生成主角失败，请重试');
      }
    } else {
      showToast('API调用失败，请检查API Key');
    }
    isGeneratingProtagonist = false;
  }).catch(err => {
    typewriterReset();
    console.error(err);
    showToast('生成主角失败');
    isGeneratingProtagonist = false;
  });
}

底层逻辑：X（200字以内，必须完整说完最后一句话，不得在逗号或句中断开）`;

  const twEl = document.getElementById('worldTypewriter');

  callDeepSeek(worldPrompt, systemPrompt, (text) => {
    typewriterFeed(text, twEl);
  }).then(result => {
    typewriterReset();
    if (result) {
      const titleMatch = result.match(/世界名称[：:]\s*(.+)/);

      if (titleMatch) {

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== ESCAPE HTML ====================
function ensureCompleteSentence(text) {
  if (!text) return text;
  const lastPeriod = Math.max(text.lastIndexOf('。'), text.lastIndexOf('！'), text.lastIndexOf('？'));
  if (lastPeriod > 0) return text.slice(0, lastPeriod + 1);
  return text;
}

function escapeHTML(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
