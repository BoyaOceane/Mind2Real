<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即墨 · 创作入口</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300..900&family=Noto+Sans+SC:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 宣纸底色系 */
      --paper-new: oklch(98% 0.006 95);
      --paper-aged: oklch(96% 0.010 92);
      --paper-dark: oklch(92% 0.014 88);
      /* 墨分五色 */
      --ink-light: oklch(65% 0.018 85);
      --ink-mid: oklch(40% 0.024 80);
      --ink-heavy: oklch(20% 0.030 70);
      --ink-black: oklch(15% 0.032 60);
      /* 朱砂唯一点缀 */
      --seal: oklch(48% 0.16 28);
      --seal-dark: oklch(38% 0.18 22);
      /* 边框 */
      --border: oklch(82% 0.008 90);
      --border-dark: oklch(60% 0.012 82);

      --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;

      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 48px;
      --space-xl: 80px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-full: 9999px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --shadow-soft: 0 2px 12px oklch(20% 0.030 70 / 0.07), 0 4px 20px oklch(20% 0.030 70 / 0.05);
      --shadow-medium: 0 4px 16px oklch(20% 0.030 70 / 0.10), 0 8px 30px oklch(20% 0.030 70 / 0.08);
      --shadow-strong: 0 8px 24px oklch(20% 0.030 70 / 0.14), 0 14px 40px oklch(20% 0.030 70 / 0.10);
      --topbar-bg: #2c2825;
      --topbar-text: #e8e2d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--paper-new);
      color: var(--ink-light);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--topbar-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
    }
    .top-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--topbar-text);
      letter-spacing: 0.05em;
    }
    .top-right {
      display: flex;
      gap: 10px;
    }
    .top-btn {
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all var(--transition-normal);
      background: rgba(255,255,255,0.10);
      color: var(--topbar-text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn:hover {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border-color: rgba(255,255,255,0.38);
    }
    .top-btn:active { transform: scale(0.95); }

    /* ===== MAIN LAYOUT ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 120px;
      gap: var(--space-lg);
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    /* ===== CARDS ===== */
    .card {
      width: 100%;
      background: var(--paper-new);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      box-shadow: var(--shadow-soft);
      transition: box-shadow var(--transition-normal);
    }
    .card:hover { box-shadow: var(--shadow-medium); }
    .card-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--ink-heavy);
    }
    .card-title-icon {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
    }
    .card-title-icon.world { background: var(--accent-world, var(--ink-mid)); }
    .card-title-icon.protagonist { background: var(--accent-protagonist, var(--seal)); }
    .card-title-icon.narrative { background: var(--accent-narrative, var(--ink-light)); }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      align-items: center;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: var(--paper-dark);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      color: var(--ink-mid);
    }
    .tag.active {
      background: oklch(48% 0.16 28 / 0.12);
      border-color: var(--seal);
      color: var(--seal-dark);
    }
    .tag-empty {
      color: var(--ink-mid);
      font-size: 0.82rem;
      font-style: italic;
    }

    .card-footer {
      margin-top: var(--space-md);
      display: flex;
      gap: var(--space-sm);
      align-items: center;
      flex-wrap: wrap;
    }

    /* ===== GOLDEN FINGER INPUT ===== */
    .golden-finger-wrap {
      margin-top: var(--space-sm);
    }
    .golden-finger-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .golden-finger-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--paper-new);
      color: var(--ink-heavy);
      transition: all var(--transition-fast);
      resize: none;
    }
    .golden-finger-input:focus {
      outline: none;
      border-color: var(--seal);
      box-shadow: 0 0 0 3px oklch(48% 0.16 28 / 0.15);
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-custom {
      background: transparent;
      color: var(--ink-mid);
      border: 1.5px solid var(--border-dark);
    }
    .btn-custom:hover {
      border-color: var(--ink-heavy);
      color: var(--ink-heavy);
    }
    .btn-generate {
      background: var(--ink-heavy);
      color: var(--paper-new);
      box-shadow: 0 3px 12px oklch(20% 0.030 70 / 0.3);
    }
    .btn-generate:hover {
      background: var(--ink-black);
      transform: translateY(-2px);
      box-shadow: 0 5px 16px oklch(20% 0.030 70 / 0.38);
    }
    .btn-generate:active { transform: translateY(0) scale(0.97); }
    .btn-generate:disabled {
      background: var(--border-dark);
      cursor: not-allowed;
      transform: none;
    }

    /* ===== BOTTOM CTA ===== */
    .bottom-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: oklch(98% 0.006 95 / 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      z-index: 90;
    }
    .btn-start {
      padding: 14px 48px;
      font-size: 1rem;
      background: var(--ink-heavy);
      color: var(--paper-new);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 4px 18px oklch(20% 0.030 70 / 0.38);
      transition: all var(--transition-normal);
    }
    .btn-start:hover {
      background: var(--ink-black);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px oklch(20% 0.030 70 / 0.45);
    }
    .btn-start:active { transform: translateY(0) scale(0.97); }

    /* ===== TAG SELECTION PANEL (Modal/Slide) ===== */
    .tag-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tag-panel-overlay.open {
      display: flex;
    }
    .tag-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 680px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }
    .tag-panel-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .tag-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--ink-heavy);
    }
    .tag-panel-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--paper-aged);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .tag-panel-close:hover { background: var(--paper-dark); }
    .tag-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-md) var(--space-lg);
    }
    .tag-panel-footer {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
      flex-shrink: 0;
    }

    .tag-dim {
      margin-bottom: var(--space-md);
    }
    .tag-dim:last-child { margin-bottom: 0; }
    .tag-dim-label {
      font-size: 0.78rem;
      color: var(--ink-mid);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-option {
      padding: 6px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--paper-new);
      color: var(--ink-mid);
    }
    .tag-option:hover {
      border-color: var(--seal);
      color: var(--seal-dark);
    }
    .tag-option.selected {
      background: oklch(48% 0.16 28 / 0.10);
      border-color: var(--seal);
      color: var(--seal-dark);
      font-weight: 600;
    }
    .tag-option input { display: none; }

    .tag-style-choice {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      padding: var(--space-lg) 0;
    }
    .tag-style-btn {
      padding: 16px 32px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.1rem;
      background: var(--paper-new);
      color: var(--ink-heavy);
      transition: all var(--transition-normal);
    }
    .tag-style-btn:hover {
      border-color: var(--seal);
      background: oklch(48% 0.16 28 / 0.08);
    }

    .btn-reset {
      background: transparent;
      border: 1.5px solid var(--border-dark);
      color: var(--ink-mid);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all var(--transition-fast);
    }
    .btn-reset:hover { border-color: var(--ink-heavy); color: var(--ink-heavy); }
    .btn-confirm {
      background: var(--ink-heavy);
      border: none;
      color: var(--paper-new);
      padding: 8px 20px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all var(--transition-fast);
    }
    .btn-confirm:hover { background: var(--ink-black); }

    /* ===== API PANEL ===== */
    .api-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .api-panel-overlay.open { display: flex; }
    .api-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: var(--space-lg);
      box-shadow: var(--shadow-strong);
    }
    .api-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: var(--space-md);
      color: var(--ink-heavy);
    }
    .api-input-wrap {
      position: relative;
    }
    .api-input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--paper-new);
      color: var(--ink-heavy);
      transition: all var(--transition-fast);
    }
    .api-input:focus {
      outline: none;
      border-color: var(--seal);
      box-shadow: 0 0 0 3px oklch(48% 0.16 28 / 0.15);
    }
    .api-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-mid);
      font-size: 0.85rem;
      padding: 4px;
    }
    .api-toggle:hover { color: var(--ink-heavy); }
    .api-save-btn {
      width: 100%;
      margin-top: var(--space-md);
      padding: 12px;
      background: var(--ink-heavy);
      color: var(--paper-new);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .api-save-btn:hover { background: var(--ink-black); }
    .api-test-btn {
      width: 100%;
      margin-top: var(--space-sm);
      padding: 10px;
      background: transparent;
      color: var(--ink-mid);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: all var(--transition-fast);
    }
    .api-test-btn:hover { border-color: var(--seal); color: var(--seal-dark); }
    .api-test-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .api-test-btn.testing { color: var(--seal); }

    /* ===== HISTORY PANEL ===== */
    .history-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(20% 0.030 70 / 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .history-panel-overlay.open { display: flex; }
    .history-panel {
      background: var(--paper-new);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }
    .history-panel-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .history-panel-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--ink-heavy);
    }
    .history-panel-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--paper-aged);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .history-panel-close:hover { background: var(--paper-dark); }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-sm);
    }
    .history-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-mid);
      font-size: 0.88rem;
    }
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }
    .history-item:hover {
      background: var(--paper-aged);
      border-color: var(--border);
    }
    .history-item-left { flex: 1; min-width: 0; }
    .history-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-heavy);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item-meta {
      font-size: 0.75rem;
      color: var(--ink-mid);
    }
    .history-item-delete {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-mid);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .history-item-delete:hover {
      background: oklch(48% 0.16 28 / 0.12);
      color: var(--seal-dark);
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translate(-50%, 16px);
      padding: 10px 20px;
      background: oklch(20% 0.030 70 / 0.92);
      color: #fff;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-strong);
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal), transform var(--transition-normal);
      z-index: 300;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-mid); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .main { padding: 24px 16px 120px; }
      .card { padding: var(--space-md); }
      .tag-panel { max-height: 90vh; }
      .history-panel { max-height: 90vh; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-title">即墨</div>
  <div class="top-right">
    <button class="top-btn" onclick="oneClickGenerate()" style="background: var(--seal); border-color: var(--seal);">一键生成</button>
    <button class="top-btn" onclick="openHistory()">历史记录</button>
    <button class="top-btn" onclick="openApi()">API设置</button>
    <a href="admin.html" class="top-btn">提示词管理</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <!-- CARD 1: 世界背景 -->
  <div class="card" id="cardWorld">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon world"></span>世界背景
      </div>
      <button class="btn btn-custom" onclick="openTagPanel('world')">自定义</button>
    </div>
    <div class="card-tags" id="worldTagsDisplay">
      <span class="tag-empty">点击"自定义"选择世界背景</span>
    </div>
  </div>

  <!-- CARD 2: 主角设定 -->
  <div class="card" id="cardProtagonist">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon protagonist"></span>主角设定
      </div>
      <button class="btn btn-custom" onclick="openTagPanel('protagonist')">自定义</button>
    </div>
    <div class="card-tags" id="protagonistTagsDisplay">
      <span class="tag-empty">点击"自定义"选择主角设定</span>
    </div>
    <div class="golden-finger-wrap">
      <div class="golden-finger-label">金手指（主角的特殊能力/优势）</div>
      <textarea class="golden-finger-input" id="goldenFingerInput" rows="2" placeholder="描述主角的金手指，例如：过目不忘、能看到他人好感度等..."></textarea>
    </div>
    <div class="card-footer">
      <button class="btn btn-generate" onclick="generateProtagonist()">生成主角</button>
      <span style="font-size:0.78rem;color:var(--text-muted);" id="protagonistHint">（金手指归属主角设定）</span>
    </div>
  </div>

  <!-- CARD 3: 叙事风格 -->
  <div class="card" id="cardNarrative">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon narrative"></span>叙事风格
      </div>
      <button class="btn btn-custom" onclick="openTagPanel('narrative')">自定义</button>
    </div>
    <div class="card-tags" id="narrativeTagsDisplay">
      <span class="tag-empty">点击"自定义"选择叙事风格（5维度各1个）</span>
    </div>
  </div>

</div>

<!-- BOTTOM CTA -->
<div class="bottom-cta">

<script>
// ==================== STATE ====================
const state = {
  world: {
    selected: {}  // dimKey -> tagName
  },
  protagonist: {
    style: '',    // 'chinese' | 'western' | ''
    selected: {}  // dimKey -> tagName
  },
  narrative: {
    selected: {}  // dimKey -> tagName
  }
};

let currentPanel = null; // 'world' | 'protagonist' | 'narrative'

// ==================== TAG DATA ====================
const worldDims = {
  '物理规律': ['现实世界','规则世界','星际世界','平行世界','微观世界','数据世界','梦境世界'],
  '时代位置': ['古代世界','近代世界','现代世界','近未来世界','远未来世界','末日世界','后末日世界'],
  '技术路线': ['蒸汽朋克','赛博朋克','柴油朋克','原子朋克','生物朋克','丝绸朋克','石器朋克'],
  '超自然力量': ['无魔世界','低魔世界','高魔世界','神话世界','克苏鲁世界','灵异世界'],
  '文明形态': ['部落世界','城邦世界','帝国世界','封建世界','资本世界','共产世界','无政府世界','蜂巢世界'],
  '存在状态': ['物质世界','精神世界','模拟世界','书中世界','死后世界','转生世界'],
  '异化方向': ['废土世界','异星世界','深海世界','地下世界','浮空世界','巨构世界']
};

const protagonistChineseDims = {
  '气质底色': ['天生领头者','柔韧适应者','热情感染型','外冷内热型','稳重可靠型','细腻滋养型','杀伐果断型','精致挑剔型','自由奔放型','神秘直觉型'],
  '能量状态': ['主动进攻型','以守为攻型','极端偏执型'],
  '处事风格': ['规矩守成型','野心攻击型','温和包容型','孤僻奇才型','踏实积累型','洒脱挥霍型','随遇而安型','毒舌叛逆型','独立自尊型','冲动义气型'],
  '人格面具': ['天生领袖范','机灵多变型','热心操劳型','刚毅果断型','乐天知足型','亦正亦邪型','稳重守成型','温柔策划型','贪多求全型','直言惹祸型','公正调和型','爱管闲事型','敢爱敢恨型','破旧立新型'],
  '内在驱动': ['自我实现驱动','财富积累驱动','事业成就驱动','情感关系驱动','自由漂泊驱动'],
  '人生轨迹': ['稳扎稳打上升型','先苦后甜奋斗型','是非缠身体质','怀才不遇苦闷型','左手进右手出型'],
  '命运课题': ['天生好命型','强势掌控型','贵人相助型','执念深重型']
};

const protagonistWesternDims = {
  '性格内核': ['高神经质','低神经质','高宜人性','低宜人性','高尽责性','低尽责性','高外向性','低外向性','高开放性','低开放性','自恋型','马基雅维利型','精神病态型','完美主义','冲动型','回避型','偏执型'],
  '内在驱动': ['成就驱动','权力驱动','亲和驱动','认知驱动','生存驱动'],
  '关系模式': ['安全型','焦虑型','回避型依恋','紊乱型'],
  '心理防线': ['升华型','幽默型','利他型','合理化','置换型','投射型','否认型','退行型'],
  '创伤印记': ['童年忽视','背叛创伤','幸存者愧疚','代际创伤','创伤后成长'],
  '自我认知': ['高自尊','低自尊','内控型','外控型','自我清晰','自我混乱']
};

const narrativeDims = {
  '主体聚焦': ['人民叙事','英雄叙事','底层叙事','精英叙事'],
  '认知视角': ['全知视角','限知视角','外视角'],
  '时态视角': ['回溯性叙事','共时性叙事'],
  '叙述可靠性': ['不可靠叙述','复调叙事'],
  '结构形式': ['元叙事','非线性叙事','碎片化叙事','反转叙事']
};

// ==================== TAG PANEL ====================
function openTagPanel(type) {
  currentPanel = type;
  const overlay = document.getElementById('tagPanelOverlay');
  const body = document.getElementById('tagPanelBody');
  const title = document.getElementById('tagPanelTitle');

  const titles = { world: '世界背景', protagonist: '主角设定', narrative: '叙事风格' };
  title.textContent = titles[type];

  // Protagonist: show style choice first if not selected
  if (type === 'protagonist' && !state.protagonist.style) {
    body.innerHTML = buildStyleChoiceHTML('protagonist');
    overlay.classList.add('open');
    return;
  }

  body.innerHTML = buildTagPanelHTML(type);

  // Pre-select current tags
  const s = state[type].selected;
  for (const [dim, tag] of Object.entries(s)) {
    const radio = body.querySelector(`input[name="${dim}"][value="${tag}"]`);
    if (radio) radio.checked = true;
  }

  overlay.classList.add('open');
}

function closeTagPanel() {
  document.getElementById('tagPanelOverlay').classList.remove('open');
  currentPanel = null;
}

function buildStyleChoiceHTML(type) {
  if (type === 'protagonist') {
    return `<div class="tag-style-choice">
      <button class="tag-style-btn" onclick="selectProtagonistStyle('chinese')">中式主角</button>
      <button class="tag-style-btn" onclick="selectProtagonistStyle('western')">西式主角</button>
    </div>`;
  }
  return '';
}

function selectProtagonistStyle(style) {
  state.protagonist.style = style;
  // Reset selected tags when switching style
  state.protagonist.selected = {};
  const body = document.getElementById('tagPanelBody');
  body.innerHTML = buildTagPanelHTML('protagonist');
}

function buildTagPanelHTML(type) {
  let dims;
  if (type === 'world') {
    dims = worldDims;
  } else if (type === 'protagonist') {
    dims = state.protagonist.style === 'western' ? protagonistWesternDims : protagonistChineseDims;
  } else {
    // narrative: single-select across all dims
    return buildNarrativePanelHTML();
  }

  let html = '';
  for (const [dim, tags] of Object.entries(dims)) {
    html += `<div class="tag-dim">
      <div class="tag-dim-label">${dim}</div>
      <div class="tag-options">`;
    for (const tag of tags) {
      html += `<label class="tag-option">
        <input type="radio" name="${dim}" value="${tag}" onchange="onTagRadioChange(this)">
        ${tag}
      </label>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function buildNarrativePanelHTML() {
  // narrative: single tag selection across all 5 dims
  const dims = narrativeDims;
  const selected = Object.values(state.narrative.selected)[0] || '';

  let html = `<div class="tag-dim">
    <div class="tag-dim-label">叙事风格（单选）</div>
    <div class="tag-options">`;
  for (const [, tags] of Object.entries(dims)) {
    for (const tag of tags) {
      const isSelected = selected === tag ? ' selected' : '';
      const isChecked = selected === tag ? ' checked' : '';
      html += `<label class="tag-option${isSelected}">
        <input type="radio" name="narrative" value="${tag}"${isChecked} onchange="onNarrativeRadioChange(this)">
        ${tag}
      </label>`;
    }
  }
  html += `</div></div>`;
  return html;
}

function onNarrativeRadioChange(radio) {
  // Single select: uncheck all others
  document.querySelectorAll('input[name="narrative"]').forEach(opt => {
    opt.checked = (opt === radio);
    opt.closest('.tag-option').classList.toggle('selected', opt === radio);
  });
}

function onTagRadioChange(radio) {
  const name = radio.name;
  const options = document.querySelectorAll(`input[name="${name}"]`);
  options.forEach(opt => {
    opt.closest('.tag-option').classList.toggle('selected', opt.checked);
  });
}

function resetTags() {
  if (currentPanel === 'protagonist') {
    state.protagonist.selected = {};
  } else if (currentPanel === 'narrative') {
    state.narrative.selected = {};
  } else {
    state[currentPanel].selected = {};
  }
  document.querySelectorAll('#tagPanelBody input[type="radio"]').forEach(r => {
    r.checked = false;
    r.closest('.tag-option').classList.remove('selected');
  });
}

function confirmTags() {
  if (currentPanel === 'narrative') {
    // narrative: single tag
    const checked = document.querySelector('#tagPanelBody input[name="narrative"]:checked');
    if (checked) {
      state.narrative.selected = { '叙事风格': checked.value };
    }
    renderCard('narrative');
    closeTagPanel();
    return;
  }

  const s = state[currentPanel].selected;
  // Collect checked radios by name
  const checked = document.querySelectorAll('#tagPanelBody input[type="radio"]:checked');
  checked.forEach(radio => {
    s[radio.name] = radio.value;
  });
  renderCard(currentPanel);
  closeTagPanel();
}

function renderCard(type) {
  const s = state[type].selected;
  const entries = Object.entries(s);
  let containerId;
  if (type === 'world') containerId = 'worldTagsDisplay';
  else if (type === 'protagonist') containerId = 'protagonistTagsDisplay';
  else containerId = 'narrativeTagsDisplay';

  const container = document.getElementById(containerId);
  if (entries.length === 0) {
    const placeholders = {
      world: '点击"自定义"选择世界背景',
      protagonist: '点击"自定义"选择主角设定',
      narrative: '点击"自定义"选择叙事风格'
    };
    container.innerHTML = `<span class="tag-empty">${placeholders[type]}</span>`;
  } else {
    // For protagonist, show style indicator + tags
    let html = '';
    if (type === 'protagonist' && state.protagonist.style) {
      const styleLabel = state.protagonist.style === 'chinese' ? '中式' : '西式';
      html = `<span class="tag active" style="background: var(--seal); color: var(--paper-new); border-color: var(--seal);">${styleLabel}</span>`;
    }
    html += entries.map(([dim, tag]) =>
      `<span class="tag active" title="${dim}">${tag}</span>`
    ).join('');
    container.innerHTML = html;
  }
}

// ==================== API PANEL ====================
function openApi() {
  const panel = document.getElementById('apiPanelOverlay');
  const input = document.getElementById('apiKeyInput');
  input.value = localStorage.getItem('deepseek_api_key') || '';
  input.type = 'password';
  panel.classList.add('open');
}

function closeApi() {
  document.getElementById('apiPanelOverlay').classList.remove('open');
}

function toggleApiKey() {
  const input = document.getElementById('apiKeyInput');
  const btn = document.querySelector('.api-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '隐藏';
  } else {
    input.type = 'password';
    btn.textContent = '显示';
  }
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showToast('请输入有效的 API Key');
    return;
  }
  localStorage.setItem('deepseek_api_key', key);
  showToast('API Key 已保存');
  closeApi();
}

async function testApiKey() {
  const btn = document.getElementById('apiTestBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('testing');
  btn.textContent = '测试中...';

  const apiKey = localStorage.getItem('deepseek_api_key') || document.getElementById('apiKeyInput').value.trim();
  if (!apiKey) {
    showToast('请先输入 API Key');
    btn.disabled = false;
    btn.classList.remove('testing');
    btn.textContent = '测试连接';
    return;
  }

  try {
    // Use non-streaming request for reliable testing
    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'user', content: 'hi' }
        ],
        max_tokens: 10,
        stream: false
      })
    });

    if (response.ok) {
      showToast('API 连接成功');
    } else {
      const err = await response.json().catch(() => ({}));
      showToast(`API 错误: ${err.error?.message || response.status}`);
    }
  } catch (err) {
    console.error(err);
    showToast('API 连接失败，请检查网络');
  } finally {
    btn.disabled = false;
    btn.classList.remove('testing');
    btn.textContent = '测试连接';
  }
}

// Click outside to close
document.getElementById('apiPanelOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeApi();
});

// ==================== HISTORY PANEL ====================
function openHistory() {
  const panel = document.getElementById('historyPanelOverlay');
  renderHistoryList();
  panel.classList.add('open');
}

function closeHistory() {
  document.getElementById('historyPanelOverlay').classList.remove('open');
}

function renderHistoryList() {
  const list = document.getElementById('historyList');
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { history = []; }

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无历史记录</div>';
    return;
  }

  list.innerHTML = history.map((item, idx) => `
    <div class="history-item" onclick="loadHistory(${idx})">
      <div class="history-item-left">
        <div class="history-item-title">${escapeHTML(item.title || '无标题')}</div>
        <div class="history-item-meta">${item.date || ''} · ${item.content ? item.content.length : 0}字</div>
      </div>
      <button class="history-item-delete" onclick="event.stopPropagation(); deleteHistory(${idx})">&#x2715;</button>
    </div>
  `).join('');
}

function loadHistory(idx) {
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { return; }
  const item = history[idx];
  if (!item) return;

  // Write to current_story_session and navigate
  const session = {
    worldTitle: item.worldTitle || '未知世界',
    worldTags: [],
    protagonist: item.protagonist || '未知主角',
    protagonistTags: [],
    goldenFinger: '',
    narrative: '',
    history: [],
    storyOutline: [],
    storyClues: [],
    characterCards: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  // Try to reconstruct history content
  if (item.content) {
    session.history = [{ content: item.content, options: [] }];
  }

  localStorage.setItem('current_story_session', JSON.stringify(session));
  window.location.href = 'story.html';
}

function deleteHistory(idx) {
  let history;
  try {
    history = JSON.parse(localStorage.getItem('story_history') || '[]');
  } catch (e) { return; }
  history.splice(idx, 1);
  localStorage.setItem('story_history', JSON.stringify(history));
  renderHistoryList();
  showToast('已删除');
}

// Click outside to close
document.getElementById('historyPanelOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeHistory();
});

// ==================== START CREATING ====================
function startCreating() {
  const w = state.world.selected;
  const p = state.protagonist.selected;
  const n = state.narrative.selected;
  const style = state.protagonist.style;

  if (Object.keys(w).length === 0) {
    showToast('请先配置世界背景');
    return;
  }
  if (!style) {
    showToast('请先配置主角设定（选择风格）');
    return;
  }
  const requiredTags = style === 'chinese' ? 7 : 6;
  if (Object.keys(p).length < requiredTags) {
    showToast(`请先完整配置主角设定（${requiredTags}个维度）`);
    return;
  }
  if (Object.keys(n).length === 0) {
    showToast('请先选择叙事风格');
    return;
  }

  // Collect tags
  const worldTags = Object.entries(w).map(([, t]) => t);
  const protagonistTags = Object.entries(p).map(([, t]) => t);
  const narrativeTag = Object.values(n)[0];

  const goldenFinger = document.getElementById('goldenFingerInput').value.trim() || state.world.generatedGolden || '无';

  const session = {
    worldTitle: state.world.generatedTitle || Object.values(w)[0] || '未知世界',
    worldDesc: state.world.generatedDesc || worldTags.join(' / '),
    worldTags,
    protagonist: state.protagonist.generatedName || '待生成主角',
    protagonistTags,
    protagonistStyle: style,
    goldenFinger,
    narrative: narrativeTag,
    narrativeDetail: n,
    history: [],
    storyOutline: [],
    storyClues: [],
    characterCards: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  localStorage.setItem('current_story_session', JSON.stringify(session));
  window.location.href = 'story.html';
}

// ==================== API ====================
function getApiConfig() {
  return {
    apiKey: localStorage.getItem('deepseek_api_key') || '',
    model: localStorage.getItem('deepseek_model') || 'deepseek-v4-pro'
  };
}

async function callDeepSeek(prompt, systemPrompt, onChunk) {
  const config = getApiConfig();
  if (!config.apiKey) return null;

  try {
    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify({
        model: config.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: prompt }
        ],
        max_tokens: 300,
        temperature: 0.8,
        stream: true
      })
    });

    if (!response.ok) throw new Error('API error');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let result = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const content = parsed.choices?.[0]?.delta?.content || '';
            if (content) {
              result += content;
              if (onChunk) onChunk(result);
            }
          } catch (e) {}
        }
      }
    }
    return result;
  } catch (error) {
    console.error('DeepSeek API错误:', error);
    return null;
  }
}

        const name = nameMatch[1].trim();
        const desc = descMatch ? descMatch[1].trim() : '';
        // Store generated protagonist name
        state.protagonist.generatedName = name;
        state.protagonist.generatedDesc = desc;
        // Update display
        const container = document.getElementById('protagonistTagsDisplay');
        const styleLabel = state.protagonist.style === 'chinese' ? '中式' : '西式';
        let html = `<span class="tag active" style="background: var(--seal); color: var(--paper-new); border-color: var(--seal);">${styleLabel}</span>`;
        html += Object.entries(s).map(([dim, tag]) =>
          `<span class="tag active" title="${dim}">${tag}</span>`
        ).join('');
        html += `<span class="tag active" style="background: var(--ink-heavy); color: var(--paper-new);">${name}</span>`;
        container.innerHTML = html;
        showToast('主角已生成');
      } else {
        showToast('生成主角失败，请重试');
      }
    } else {
      showToast('API调用失败，请检查API Key');
    }
    isGeneratingProtagonist = false;
  }).catch(err => {
    console.error(err);
    showToast('生成主角失败');
    isGeneratingProtagonist = false;
  });
}

// ==================== ONE CLICK GENERATE ====================
let isOneClickGenerating = false;

function oneClickGenerate() {
  if (isOneClickGenerating) return;

  const config = getApiConfig();
  if (!config.apiKey) {
    showToast('请先设置 API Key');
    openApi();
    return;
  }

  isOneClickGenerating = true;
  showToast('正在生成...');

  // Step 1: Randomly select tags
  const style = Math.random() < 0.5 ? 'chinese' : 'western';
  state.protagonist.style = style;

  // World tags: one from each category
  const worldSelected = {};
  for (const [dim, tags] of Object.entries(worldDims)) {
    const randomTag = tags[Math.floor(Math.random() * tags.length)];
    worldSelected[dim] = randomTag;
  }
  state.world.selected = worldSelected;
  renderCard('world');

  // Narrative: single random tag
  const allNarrativeTags = Object.values(narrativeDims).flat();
  const randomNarrative = allNarrativeTags[Math.floor(Math.random() * allNarrativeTags.length)];
  state.narrative.selected = { '叙事风格': randomNarrative };
  renderCard('narrative');

  // Protagonist tags: one from each dimension
  const dims = style === 'chinese' ? protagonistChineseDims : protagonistWesternDims;
  const protoSelected = {};
  for (const [dim, tags] of Object.entries(dims)) {
    const randomTag = tags[Math.floor(Math.random() * tags.length)];
    protoSelected[dim] = randomTag;
  }
  state.protagonist.selected = protoSelected;
  renderCard('protagonist');

  // Step 2: Generate world description + golden finger + narrative
  const worldTags = Object.values(worldSelected).join('、');
  const narrativeTag = randomNarrative;
  const styleLabel = style === 'chinese' ? '中式' : '西式';

  const worldPrompt = `根据以下随机标签，生成一个小说世界背景设定。

世界标签：${worldTags}
叙事风格：${narrativeTag}
主角风格：${styleLabel}

请直接输出，格式如下（不要有任何其他内容）：
世界名称：[简短的世界名称，4-8字]
世界观描述：[50字以内的世界观描述]
金手指：[主角的特殊能力，20字以内]
叙事风格描述：[20字以内的叙事风格描述]

例如：
世界名称：星际迷局
世界观描述：人类已征服银河系，但边境殖民地与中心星区矛盾日益加深
金手指：能够感知他人情绪波动
叙事风格描述：悬疑推进，细节暗示`;

  const systemPrompt = '你是一个世界背景生成助手。每次只生成一个世界设定。';

  callDeepSeek(worldPrompt, systemPrompt, null).then(result => {
    if (result) {
      const titleMatch = result.match(/世界名称[：:]\s*(.+)/);
      const descMatch = result.match(/世界观描述[：:]\s*(.+)/);
      const goldenMatch = result.match(/金手指[：:]\s*(.+)/);
      const narrativeMatch = result.match(/叙事风格描述[：:]\s*(.+)/);

      if (titleMatch) {
        const title = titleMatch[1].trim();
        const desc = descMatch ? descMatch[1].trim() : '';
        const golden = goldenMatch ? goldenMatch[1].trim() : '';
        const narrativeDesc = narrativeMatch ? narrativeMatch[1].trim() : '';

        // Update world card display
        const worldContainer = document.getElementById('worldTagsDisplay');
        let html = `<span class="tag active" style="background: var(--ink-heavy); color: var(--paper-new);">${title}</span>`;
        html += Object.entries(worldSelected).map(([, tag]) =>
          `<span class="tag active">${tag}</span>`
        ).join('');
        html += `<span class="tag active" title="世界观">${desc}</span>`;
        if (golden) html += `<span class="tag active" title="金手指">金手指：${golden}</span>`;
        worldContainer.innerHTML = html;

        // Store generated data
        state.world.generatedTitle = title;
        state.world.generatedDesc = desc;
        state.world.generatedGolden = golden;
        state.world.generatedNarrativeDesc = narrativeDesc;
        document.getElementById('goldenFingerInput').value = golden;

        // Step 3: Generate protagonist based on world
        generateProtagonistForWorld(title, desc, golden, narrativeDesc, style, protoSelected);
      } else {
        showToast('生成世界背景失败，请重试');
        isOneClickGenerating = false;
      }
    } else {
      showToast('API调用失败，请检查API Key');
      isOneClickGenerating = false;
    }
  }).catch(err => {
    console.error(err);
    showToast('生成失败');
    isOneClickGenerating = false;
  });
}

function generateProtagonistForWorld(worldTitle, worldDesc, goldenFinger, narrativeDesc, style, selectedTags) {
  const tags = Object.entries(selectedTags).map(([, v]) => v).join('、');
  const styleLabel = style === 'chinese' ? '中式' : '西式';

  const prompt = `根据以下世界观设定，生成一个符合这个世界的主角名字和简介。

世界名称：${worldTitle}
世界观：${worldDesc}
金手指：${goldenFinger}
叙事风格：${narrativeDesc}
主角风格：${styleLabel}主角
性格标签：${tags}

请直接输出，格式如下（不要有任何其他内容）：
名字：[名字]
简介：[20字以内的简介，符合上述世界观设定]

例如：
名字：沈夜
简介：星际赏金猎人，能感知他人情绪波动，冷静果决`;

  const systemPrompt = '你是一个主角设定生成助手。每次只生成一个主角名字和简介。';

  callDeepSeek(prompt, systemPrompt, null).then(result => {
    if (result) {
      const nameMatch = result.match(/名字[：:]\s*(.+)/);
      const descMatch = result.match(/简介[：:]\s*(.+)/);
      if (nameMatch) {
        const name = nameMatch[1].trim();
        const desc = descMatch ? descMatch[1].trim() : '';
        state.protagonist.generatedName = name;
        state.protagonist.generatedDesc = desc;

        const container = document.getElementById('protagonistTagsDisplay');
        let html = `<span class="tag active" style="background: var(--seal); color: var(--paper-new); border-color: var(--seal);">${styleLabel}</span>`;
        html += Object.entries(selectedTags).map(([, tag]) =>
          `<span class="tag active">${tag}</span>`
        ).join('');
        html += `<span class="tag active" style="background: var(--ink-heavy); color: var(--paper-new);">${name}</span>`;
        container.innerHTML = html;
        showToast('一键生成完成');
      } else {
        showToast('生成主角失败');
      }
    } else {
      showToast('API调用失败');
    }
    isOneClickGenerating = false;
  }).catch(err => {
    console.error(err);
    showToast('生成失败');
    isOneClickGenerating = false;
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== ESCAPE HTML ====================
function escapeHTML(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ==================== CLOSE PANELS ON ESC ====================
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTagPanel();
    closeApi();
    closeHistory();
  }
});

// ==================== INIT ====================
// Tag panel overlay click outside to close
document.getElementById('tagPanelOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeTagPanel();
});
</script>
