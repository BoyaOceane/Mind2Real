<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即墨 · 写作 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300..900&family=Noto+Sans+SC:wght@300..700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       即墨 Agent · 设计系统
       宣纸色为境 · 墨分五色 · 朱砂为印
    ============================================================ */
    :root {
      --paper-new:   oklch(98% 0.006 95);
      --paper-aged:  oklch(96% 0.010 92);
      --paper-dark:  oklch(92% 0.014 88);
      --ink-light:   oklch(65% 0.018 85);
      --ink-mid:     oklch(40% 0.024 80);
      --ink-heavy:   oklch(20% 0.030 70);
      --ink-black:   oklch(15% 0.032 60);
      --seal:        oklch(48% 0.16 28);
      --seal-dark:   oklch(38% 0.18 22);
      --border:      oklch(82% 0.008 90);
      --border-dark: oklch(60% 0.012 82);
      --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      --font-body:    'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --space-xs:  8px;
      --space-sm:  16px;
      --space-md:  24px;
      --space-lg:  48px;
      --sidebar-w: 320px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper-new);
      color: var(--ink-light);
      line-height: 1.8;
      height: 100%;
      display: flex;
      overflow: hidden;
    }

    /* === 侧边栏 === */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100vh;
      background: var(--paper-aged);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: var(--space-md);
      gap: var(--space-md);
      overflow-y: auto;
      z-index: 10;
    }
    .sidebar-section { border-bottom: 1px solid var(--border); padding-bottom: var(--space-sm); }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--seal); margin-bottom: var(--space-xs);
    }

    /* === 主区域 === */
    #main {
      flex: 1; height: 100vh; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: var(--space-lg);
    }

    /* === API 状态指示灯 === */
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-dot.on { background: oklch(55% 0.16 145); }
    .status-dot.off { background: var(--seal); }

    /* === 入口：姿态选择 === */
    #entry-screen { text-align: center; max-width: 640px; }
    .mode-cards { display: flex; gap: var(--space-md); margin-top: var(--space-lg); }
    .mode-card {
      flex: 1; padding: var(--space-lg); border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; text-align: left;
    }
    .mode-card:hover { border-color: var(--seal); box-shadow: 0 8px 24px oklch(20% 0.030 70 / 0.08); }
    .mode-card.selected { border-color: var(--seal); background: oklch(48% 0.16 28 / 0.04); }
    .mode-card h3 { font-family: var(--font-display); font-size: 20px; color: var(--ink-heavy); margin-bottom: 8px; }
    .mode-card p { font-size: 14px; color: var(--ink-mid); }

    /* === 阶段1：对话气泡 === */
    #chat-area { width: 100%; max-width: 640px; }
    .chat-bubble { margin-bottom: var(--space-md); max-width: 80%; padding: var(--space-sm) var(--space-md); border-radius: 8px; line-height: 1.7; }
    .chat-bubble.ai { background: var(--paper-aged); color: var(--ink-mid); align-self: flex-start; }
    .chat-bubble.user { background: var(--ink-heavy); color: var(--paper-new); align-self: flex-end; margin-left: auto; }
    .chat-input-row { display: flex; gap: var(--space-xs); margin-top: var(--space-md); }
    .chat-input-row input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-body); font-size: 15px; outline: none; }
    .chat-input-row input:focus { border-color: var(--seal); }

    /* === 按钮 === */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink-heavy); color: var(--paper-new);
      border: none; border-radius: 4px; padding: 12px 28px;
      font-family: var(--font-body); font-size: 15px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--ink-black); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--ink-heavy);
      border: 1.5px solid var(--border-dark); border-radius: 4px;
      padding: 11px 28px; font-family: var(--font-body); font-size: 15px; cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--ink-heavy); }
    .btn-icon {
      background: none; border: none; cursor: pointer; font-size: 14px;
      padding: 4px; border-radius: 4px; transition: background 0.2s; color: var(--ink-mid);
    }
    .btn-icon:hover { background: var(--paper-dark); }

    /* === 阶段2：卡片编辑 === */
    .framework-card {
      background: var(--paper-new); border: 1px solid var(--border); border-radius: 8px;
      padding: var(--space-lg); max-width: 640px; width: 100%;
    }
    .framework-card h3 { font-family: var(--font-display); font-size: 18px; color: var(--ink-heavy); margin-bottom: var(--space-sm); }
    .framework-card textarea {
      width: 100%; min-height: 100px; padding: var(--space-sm); border: 1px solid var(--border);
      border-radius: 4px; font-family: var(--font-body); font-size: 15px; resize: vertical;
      color: var(--ink-light); line-height: 1.8;
    }
    .framework-card input {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px;
      font-family: var(--font-display); font-size: 16px; color: var(--ink-heavy);
    }

    /* === 阶段3：阅读流 === */
    #reading-area { max-width: 640px; width: 100%; }
    .story-text {
      font-family: var(--font-body); font-size: 17px; color: var(--ink-light);
      line-height: 2; white-space: pre-wrap;
    }
    .choice-row { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-lg); }
    .choice-btn {
      text-align: left; padding: var(--space-sm) var(--space-md); border: 1px solid var(--border);
      border-radius: 6px; background: var(--paper-new); cursor: pointer; font-size: 14px;
      color: var(--ink-mid); transition: border-color 0.2s;
    }
    .choice-btn:hover { border-color: var(--seal); }

    /* === 灵感面板 === */
    .inspiration-card {
      background: var(--paper-new); border: 1px solid var(--border); border-radius: 4px;
      padding: var(--space-sm); margin-top: var(--space-xs); font-size: 13px; line-height: 1.6;
    }
    .tag { display: inline-block; background: var(--paper-dark); color: var(--ink-mid); border-radius: 3px; padding: 2px 8px; font-size: 12px; margin: 2px; }
    .tag-seal { background: oklch(48% 0.16 28 / 0.12); color: var(--seal-dark); }

    /* === 七层递进 === */
    .layer-item { font-size: 13px; padding: 4px 0; color: var(--ink-mid); display: flex; align-items: center; gap: 6px; }
    .layer-item.done { color: var(--ink-light); }
    .layer-item.done::before { content: '✓'; color: oklch(55% 0.16 145); font-weight: bold; }
    .layer-item.current { color: var(--seal); font-weight: 600; }
    .layer-item.current::before { content: '→'; }
    .layer-item.pending { color: var(--ink-light); opacity: 0.4; }
    .layer-item.pending::before { content: '○'; }

    /* === API 配置面板 === */
    #api-config-panel input {
      width: 100%; margin-top: 4px; padding: 6px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 13px; font-family: var(--font-body);
    }
    #api-config-panel input:focus { border-color: var(--seal); outline: none; }

    /* === 通用 === */
    .hidden { display: none !important; }
    .title-lg { font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--ink-heavy); }
    .subtitle { font-size: 14px; color: var(--ink-mid); margin-top: var(--space-xs); }
    .loading-text { color: var(--ink-mid); font-size: 15px; text-align: center; padding: var(--space-lg); }

    /* === 响应式 === */
    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; min-width: 100%; height: auto; max-height: 40vh; flex-shrink: 0; }
      #main { padding: var(--space-md); }
      .mode-cards { flex-direction: column; }
    }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="sidebar-section" id="api-section">
      <div class="sidebar-label">⚙ API</div>
      <div id="api-status"><span class="status-dot off"></span>未配置</div>
      <div id="api-config-panel" class="hidden">
        <input id="api-url" type="text" placeholder="https://api.deepseek.com/v1">
        <input id="api-key" type="password" placeholder="sk-...">
        <button class="btn-primary" id="btn-test-api" style="width:100%;margin-top:8px;padding:8px;font-size:13px;">测试连接</button>
      </div>
      <button class="btn-icon" id="btn-toggle-api" style="margin-top:4px;">展开 ▼</button>
    </div>

    <div class="sidebar-section" id="stage-section">
      <div class="sidebar-label">阶段</div>
      <div id="stage-indicator">
        <div style="color:var(--ink-light);opacity:0.4;font-size:13px;">○ 理解你</div>
        <div style="color:var(--ink-light);opacity:0.4;font-size:13px;">○ 搭框架</div>
        <div style="color:var(--ink-light);opacity:0.4;font-size:13px;">○ 写故事</div>
      </div>
    </div>

    <div class="sidebar-section hidden" id="dilemma-section">
      <div class="sidebar-label">困境</div>
      <p id="sidebar-dilemma" style="font-family:var(--font-display);font-size:14px;color:var(--ink-heavy);"></p>
    </div>

    <div class="sidebar-section hidden" id="layers-section">
      <div class="sidebar-label">七层递进</div>
      <div id="layers-tracker"></div>
    </div>

    <div class="sidebar-section" id="inspiration-section">
      <div class="sidebar-label">灵感</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" id="btn-inspire-char" style="flex:1;font-size:13px;padding:8px;">🎲 角色</button>
        <button class="btn-secondary" id="btn-inspire-world" style="flex:1;font-size:13px;padding:8px;">🎲 世界</button>
        <button class="btn-secondary" id="btn-inspire-narr" style="flex:1;font-size:13px;padding:8px;">🎲 叙事</button>
      </div>
      <div id="inspiration-result"></div>
    </div>

    <div class="sidebar-section" id="settings-section">
      <div class="sidebar-label">设置</div>
      <div style="font-size:13px;color:var(--ink-mid);">
        字数: <select id="word-count-pref" style="margin-left:4px;padding:2px 4px;border:1px solid var(--border);border-radius:3px;font-size:13px;">
          <option value="500">500</option>
          <option value="800" selected>800</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div id="mode-display" style="font-size:13px;color:var(--ink-mid);margin-top:4px;"></div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main id="main">
    <div id="entry-screen">
      <div class="title-lg">你想怎么创作？</div>
      <p class="subtitle" style="margin-top:8px;">选择一种姿态，决定了你和故事的关系</p>
      <div class="mode-cards">
        <div class="mode-card" data-mode="immersion" onclick="selectMode('immersion')">
          <h3>📖 代入式</h3>
          <p>你成为主角<br>通过主角的感官体验故事<br>情感是唯一的指南针</p>
        </div>
        <div class="mode-card" data-mode="director" onclick="selectMode('director')">
          <h3>🎬 旁观式</h3>
          <p>你来当导演<br>掌控全局，调度角色<br>逻辑是叙事的骨架</p>
        </div>
      </div>
      <button class="btn-primary hidden" id="btn-start" onclick="startUnderstanding()" style="margin-top:var(--space-lg);">开始创作 →</button>
    </div>
    <div id="chat-screen" class="hidden">
      <div id="chat-area">
        <div id="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="说说你想写的..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="btn-primary" id="btn-send" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
    <div id="frame-screen" class="hidden"></div>
    <div id="write-screen" class="hidden"></div>
  </main>

  <script>
    // === STATE ===
    const DEFAULT_STATE = {
      stage: 'entry',
      mode: null,
      dilemma: '',
      synopsis: '',
      currentLayer: 1,
      history: []
    };

    let state = { ...DEFAULT_STATE };

    function saveState() {
      try { localStorage.setItem('jimo_agent_state', JSON.stringify(state)); } catch(e) {}
    }

    function selectMode(mode) {
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
      document.getElementById('btn-start').classList.remove('hidden');
      state.mode = mode;
      document.getElementById('mode-display').textContent = mode === 'immersion' ? '模式: 代入式' : '模式: 旁观式';
    }

    let chatRound = 0;

    function startUnderstanding() {
      document.getElementById('entry-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      state.stage = 'understand';
      updateStageIndicator();
      saveState();
      appendChatMessage('ai', "今天想写什么？可以是一个画面、一种情绪、一个执念，或者只是一个模糊的念头。说来听听。");
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.disabled = true;
      document.getElementById('btn-send').disabled = true;
      appendChatMessage('user', text);
      chatRound++;

      if (!getApiConfig().key) {
        appendChatMessage('ai', '请先在侧边栏配置 API Key。');
        input.disabled = false;
        document.getElementById('btn-send').disabled = false;
        return;
      }

      appendChatMessage('ai', '<em>思考中...</em>');
      try {
        const reply = await callSkill('understand', { message: text, round: chatRound, mode: state.mode });
        removeLastChatMessage();
        appendChatMessage('ai', reply.message || reply.raw || JSON.stringify(reply));
        if (reply.ready || chatRound >= 3) {
          input.disabled = true;
          document.getElementById('btn-send').disabled = true;
          const dilemma = reply.dilemma || '';
          setTimeout(() => startFramework(dilemma), 1500);
        } else {
          input.disabled = false;
          document.getElementById('btn-send').disabled = false;
        }
      } catch (e) {
        removeLastChatMessage();
        appendChatMessage('ai', '出错了: ' + e.message);
        input.disabled = false;
        document.getElementById('btn-send').disabled = false;
      }
    }

    function appendChatMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'chat-bubble ' + role;
      div.innerHTML = text;
      document.getElementById('chat-messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function removeLastChatMessage() {
      const msgs = document.getElementById('chat-messages');
      if (msgs.lastChild) msgs.removeChild(msgs.lastChild);
    }

    function startFramework(dilemma) {
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('frame-screen').classList.remove('hidden');
      state.stage = 'frame';
      state.dilemma = dilemma;
      document.getElementById('sidebar-dilemma').textContent = dilemma;
      document.getElementById('dilemma-section').classList.remove('hidden');
      updateStageIndicator();
      saveState();
    }

    // === API CLIENT ===
    function getApiConfig() {
      const stored = localStorage.getItem('jimo_api_config');
      const defaults = { url: 'https://api.deepseek.com/v1', key: '', model: 'deepseek-v4-pro' };
      if (!stored) return defaults;
      try { return { ...defaults, ...JSON.parse(stored) }; } catch (e) { return defaults; }
    }

    function saveApiConfig(config) {
      localStorage.setItem('jimo_api_config', JSON.stringify(config));
      updateApiStatus();
    }

    function getWordCountPref() {
      return parseInt(document.getElementById('word-count-pref').value) || 800;
    }

    function updateApiStatus() {
      const config = getApiConfig();
      const dot = document.querySelector('#api-status .status-dot');
      const container = document.getElementById('api-status');
      if (config.key) {
        dot.className = 'status-dot on';
        container.innerHTML = '<span class="status-dot on"></span>已连接 · ' + config.model;
      } else {
        dot.className = 'status-dot off';
        container.innerHTML = '<span class="status-dot off"></span>未配置';
      }
    }

    // Toggle API config panel
    document.getElementById('btn-toggle-api').addEventListener('click', () => {
      const panel = document.getElementById('api-config-panel');
      panel.classList.toggle('hidden');
      document.getElementById('btn-toggle-api').textContent = panel.classList.contains('hidden') ? '展开 ▼' : '收起 ▲';
    });

    // Test connection
    document.getElementById('btn-test-api').addEventListener('click', async () => {
      const url = document.getElementById('api-url').value.trim() || 'https://api.deepseek.com/v1';
      const key = document.getElementById('api-key').value.trim();
      if (!key) { showNotification('请填写 API Key', 'error'); return; }
      const btn = document.getElementById('btn-test-api');
      btn.textContent = '测试中...'; btn.disabled = true;
      try {
        const res = await fetch(`${url.replace(/\/$/, '')}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({ model: 'deepseek-v4-pro', messages: [{ role: 'user', content: 'hi' }], max_tokens: 5 })
        });
        if (res.ok) {
          saveApiConfig({ url, key, model: 'deepseek-v4-pro' });
          document.getElementById('api-url').value = url;
          document.getElementById('api-key').value = key;
          showNotification('✅ 连接成功', 'success');
        } else {
          const err = await res.json().catch(() => ({}));
          showNotification('❌ ' + (err.error?.message || `HTTP ${res.status}`), 'error');
        }
      } catch (e) {
        showNotification('❌ 连接失败: ' + e.message, 'error');
      }
      btn.textContent = '测试连接'; btn.disabled = false;
    });

    // === Core API call ===
    async function callSkill(skill, params) {
      const config = getApiConfig();
      if (!config.key) throw new Error('请先配置 API Key');

      const messages = buildPrompt ? buildPrompt(skill, params) : [{ role: 'user', content: params.message || 'hi' }];

      const isStream = skill === 'write';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);
      const res = await fetch(`${config.url.replace(/\/$/, '')}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
        body: JSON.stringify({
          model: config.model,
          messages,
          temperature: skill === 'write' ? 0.8 : 0.6,
          max_tokens: skill === 'write' ? 2000 : 600,
          stream: isStream
        }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      if (isStream) {
        return await readStream(res, skill);
      } else {
        const data = await res.json();
        const content = data.choices[0].message.content;
        return parseSkillResponse(skill, content);
      }
    }

    async function readStream(res, skill) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let firstChunk = true;
      const startTime = Date.now();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (firstChunk) {
          if (Date.now() - startTime > 5000) throw new Error('响应超时，请检查网络');
          firstChunk = false;
        }
        const chunk = decoder.decode(value, { stream: true });
        for (const line of chunk.split('\n')) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6).trim();
            if (data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) fullText += delta;
            } catch (e) { /* skip malformed JSON chunks */ }
          }
        }
      }
      return parseSkillResponse(skill, fullText);
    }

    function parseSkillResponse(skill, text) {
      const cleaned = text.replace(/```json\s*|\s*```/g, '').trim();
      try {
        return JSON.parse(cleaned);
      } catch (e) {
        if (skill === 'write') {
          return { content: text, choices: ['继续推进剧情', '深入角色内心', '引入新冲突'], currentLayer: 1 };
        }
        return { raw: text };
      }
    }
    // === PROMPTS ===
    // === INSPIRATION DATA ===
    // === UI CONTROLLER ===
    function showNotification(msg, type) {
      const el = document.createElement('div');
      el.textContent = msg;
      el.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:6px;z-index:100;font-size:14px;' +
        (type === 'error' ? 'background:var(--seal);color:white;' : 'background:oklch(55% 0.16 145);color:white;');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function updateStageIndicator() {
      const labels = ['理解你', '搭框架', '写故事'];
      const current = state.stage === 'understand' ? 0 : state.stage === 'frame' ? 1 : state.stage === 'write' ? 2 : -1;
      document.getElementById('stage-indicator').innerHTML = labels.map((l, i) => {
        if (i === current) return `<div style="color:var(--seal);font-weight:600;font-size:14px;">● ${l}</div>`;
        if (i < current) return `<div style="color:var(--ink-light);font-size:13px;">✓ ${l}</div>`;
        return `<div style="color:var(--ink-light);opacity:0.4;font-size:13px;">○ ${l}</div>`;
      }).join('');
    }
    // === INIT ===
    (function init() {
      const config = getApiConfig();
      if (config.url) document.getElementById('api-url').value = config.url;
      if (config.key) document.getElementById('api-key').value = config.key;
      updateApiStatus();
      const prefs = JSON.parse(localStorage.getItem('jimo_prefs') || '{}');
      if (prefs.wordCount) document.getElementById('word-count-pref').value = prefs.wordCount;
    })();

    // Word count preference save
    document.getElementById('word-count-pref').addEventListener('change', () => {
      const prefs = JSON.parse(localStorage.getItem('jimo_prefs') || '{}');
      prefs.wordCount = getWordCountPref();
      localStorage.setItem('jimo_prefs', JSON.stringify(prefs));
    });
  </script>
</body>
</html>
